let rewardSound=true,rewardAudio=null,rewardCount=0;
try{rewardSound=localStorage.getItem('pep6-reward-sound')!=='off'}catch(e){}
function updateSoundToggle(){let b=document.getElementById('soundToggle');b.textContent=rewardSound?'♫ 音效开':'♪ 音效关';b.setAttribute('aria-pressed',String(rewardSound));b.setAttribute('aria-label',rewardSound?'关闭答对音效':'开启答对音效')}
function toggleRewardSound(){rewardSound=!rewardSound;try{localStorage.setItem('pep6-reward-sound',rewardSound?'on':'off')}catch(e){}updateSoundToggle()}
function rewardChime(){if(!rewardSound)return;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;rewardAudio=rewardAudio||new Audio();if(rewardAudio.state==='suspended')rewardAudio.resume().catch(()=>{});const t=rewardAudio.currentTime;[659.25,830.61,987.77].forEach((hz,i)=>{const o=rewardAudio.createOscillator(),gain=rewardAudio.createGain();o.type='sine';o.frequency.value=hz;gain.gain.setValueAtTime(0,t+i*.065);gain.gain.linearRampToValueAtTime(.045,t+i*.065+.012);gain.gain.exponentialRampToValueAtTime(.001,t+i*.065+.22);o.connect(gain);gain.connect(rewardAudio.destination);o.start(t+i*.065);o.stop(t+i*.065+.24);o.onended=()=>{o.disconnect();gain.disconnect()}})}catch(e){}}
function celebrateCorrect(anchor){rewardCount++;rewardChime();document.querySelectorAll('.reward-burst').forEach(e=>e.remove());const r=anchor?.getBoundingClientRect();const x=Math.max(70,Math.min(innerWidth-70,r?r.left+r.width/2:innerWidth/2));const y=Math.max(90,Math.min(innerHeight-90,r?r.top:innerHeight*.45));const burst=document.createElement('div');burst.className='reward-burst';burst.setAttribute('aria-hidden','true');burst.style.left=x+'px';burst.style.top=y+'px';const colors=['#e7a337','#36896c','#e5755c','#679bc2'];for(let i=0;i<14;i++){const spark=document.createElement('span');spark.className='reward-spark';spark.textContent=i%3?'✦':'●';const angle=Math.PI*2*i/14;spark.style.setProperty('--dx',Math.cos(angle)*85+'px');spark.style.setProperty('--dy',Math.sin(angle)*65-20+'px');spark.style.setProperty('--rot',i*43+'deg');spark.style.setProperty('--spark',colors[i%4]);burst.append(spark)}const label=document.createElement('span');label.className='reward-label';label.textContent='答对啦！';burst.append(label);document.body.append(burst);setTimeout(()=>burst.remove(),850)}
updateSoundToggle();

function renderUnit(){games={};const u=DATA[current];let items=u[category];let size=category==='grammar'?Math.min(items.length,4):category==='patterns'?2:5;let groups=[];for(let i=0;i<items.length;i+=size)groups.push(items.slice(i,i+size));if(category==='trans')groups=u.passages.map(p=>p.items);let perPage=category==='trans'?1:4;let pageCount=Math.ceil(groups.length/perPage);page=Math.min(page,Math.max(0,pageCount-1));$('#app').innerHTML=`<button onclick="home()">← 单元地图</button><div class="unit-title"><div><div class="eyebrow">${current<6?'UNIT 0'+(current+1):'REVISION'} · ${u.cn}</div><h1>${u.name}</h1><span class="small">阅读 → 挑战 → 反馈 → 再挑战</span></div><span style="font-size:46px">${icons[current]}</span></div><nav class="tabs">${current===0?`<button onclick="changeCat('videos')">▶ 课文动画</button>`:''}${current<6?`<button onclick="changeCat('race')">🏆 词汇配对赛</button>`:''}${Object.keys(labels).filter(k=>u[k].length).map(k=>`<button class="${k===category?'active':''}" onclick="changeCat('${k}')">${labels[k]}</button>`).join('')}</nav><div class="gamebar"><p class="small">${labels[category]} · 共 ${items.length} ${category==='grammar'?'个知识点':'条'} · 每个小组学完即练</p>${pageCount>1?`<select aria-label="选择知识组" onchange="page=Number(this.value);renderUnit()">${Array.from({length:pageCount},(_,i)=>`<option value="${i}" ${i===page?'selected':''}>${category==='trans'?esc(u.passages[i].title):`第 ${i*4+1}–${Math.min(i*4+4,groups.length)} 组`}</option>`).join('')}</select>`:''}</div><div id="lessons"></div><div class="footer">词汇和中英对照沿用已有学习网页；游戏题为配套练习。朗读效果取决于设备语音支持。</div>`;
groups.slice(page*perPage,page*perPage+perPage).forEach((group,j)=>{let n=page*perPage+j,key=`${current}-${category}-${n}${category==='patterns'?'-split-v2':category==='grammar'?'-group-v2':category==='trans'?'-passage-v2':''}`;let read=category==='grammar'?group.map(q=>`<div class="grammar-point"><h2>${esc(q[0])}</h2><p>${esc(q[1])}</p><div class="note">${esc(q[2].replace('___',q[3]))}</div></div>`).join(''):group.map(p=>`<div class="entry"><div class="en">${esc(p[0])}${p[2]?`<br><small>${esc(p[2])}</small>`:''}</div><div class="cn">${esc(p[1])}</div><button aria-label="朗读" data-speak="${esc(p[0])}">♪</button></div>`).join('');let art=document.createElement('article');art.className='lesson';art.innerHTML=`<h2><span class="small">READ ${n+1<10?'0':''}${n+1}</span> · ${category==='trans'?esc(u.passages[n].title):labels[category]+'小站'} ${saved[key]?'★':''}</h2><div class="reading">${read}</div><div class="game" id="g${n}"><h3>PLAY · ${category==='patterns'?'句子拼装工坊':category==='grammar'?'语法修理站':category==='verbs'?'时光变身挑战':category==='trans'?'句意寻宝':'词义寻宝'}</h3><p class="small">${category==='patterns'?'点击词块拼出刚刚学过的句子。':'读完上面的知识点，再来试一试。答错会有提示，可以重新尝试。'}</p><button class="primary" onclick="start(${n})">开始挑战 →</button></div>`;$('#lessons').append(art);games[n]={key,group,mode:'ready',index:0,score:0,mistakes:0,used:[],paused:false}});document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));stars()}
function start(n){let g=games[n];clearTimeout(g.timer);Object.assign(g,{mode:'playing',index:0,score:0,mistakes:0,used:[],paused:false});g.questions=category==='trans'?[...g.group]:shuffle(g.group);showGame(n)}
function showGame(n){const g=games[n],box=$('#g'+n);if(g.paused){box.innerHTML=`<h3>休息一下 🌿</h3><p>进度留在这里，准备好再继续。</p><button onclick="pauseGame(${n})">继续挑战</button>`;return}if(g.index>=g.questions.length){g.mode='done';saved[g.key]=true;persist();box.innerHTML=`<h3>★ 知识徽章到手！</h3><p>完成 ${g.questions.length} 道挑战 · 首次答对 ${g.score} 道<br>${g.mistakes?'你通过提示和重试完成了学习，做得好！':'全部一次答对，太棒了！'}</p><button class="primary" onclick="start(${n})">再挑战一次 ↻</button>`;return}let q=g.questions[g.index];g.used=[];g.wrong=false;g.answered=false;let body='';if(category==='patterns'){g.tokens=q[0].split(/\s+/);g.order=shuffle(g.tokens.map((t,i)=>i));body=`<div class="prompt">${esc(q[1])}</div><div class="answerline" id="answer${n}">点击下方词块，拼出英文</div><div class="tokens">${g.order.map(i=>`<button id="t${n}-${i}" onclick="token(${n},${i})">${esc(g.tokens[i])}</button>`).join('')}</div><button onclick="undo(${n})">撤回一块</button> <button class="primary" onclick="checkSentence(${n})">检查句子</button>`}else{let correct=category==='grammar'?q[3]:q[1];let others=category==='grammar'?q[4]:(category==='trans'&&g.group.length>2?g.group:DATA[current][category]).map(x=>x[1]);g.answer=correct;g.options=shuffle([correct,...shuffle([...new Set(others.filter(x=>x!==correct))]).slice(0,2)]);body=`<div class="prompt">${esc(category==='grammar'?q[2]:q[0])}</div><div class="options">${g.options.map((o,k)=>`<button onclick="choose(${n},${k},this)">${esc(o)}</button>`).join('')}</div>`}box.innerHTML=`<div class="gamebar"><strong>挑战 ${g.index+1} / ${g.questions.length}</strong><button onclick="pauseGame(${n})">暂停</button></div><div class="meter"><span style="width:${g.index/g.questions.length*100}%"></span></div>${body}<div class="feedback" id="f${n}" role="status" aria-live="polite"></div>`}
function pauseGame(n){let g=games[n];if(!g.paused){clearTimeout(g.timer);g.backup=$('#g'+n).innerHTML;g.paused=true;showGame(n)}else{g.paused=false;$('#g'+n).innerHTML=g.backup;if(g.answered)scheduleNext(n)}}
function feedback(n,ok,msg){let g=games[n];if(g.answered)return;let f=$('#f'+n);f.className='feedback '+(ok?'correct':'wrong');f.textContent=(ok?'✓ ':'再想一想：')+msg;if(ok){g.answered=true;celebrateCorrect(f);if(!g.wrong)g.score++;f.textContent+=' 即将自动继续…';scheduleNext(n);$('#g'+n).querySelectorAll('.options button,.tokens button').forEach(b=>b.disabled=true)}else{g.wrong=true;g.mistakes++}}
function choose(n,k,b){let g=games[n];if(g.paused||g.answered)return;let q=g.questions[g.index],ok=g.options[k]===g.answer;feedback(n,ok,ok?`答对了！${category==='grammar'?q[5]:q[0]+' → '+q[1]}`:category==='grammar'?q[5]:`回想刚读过的配对：${q[0]} → ${q[1]}。再选一次。`);if(!ok)b.disabled=true}
function token(n,i){let g=games[n];if(g.answered||g.paused||g.used.includes(i))return;g.used.push(i);$('#t'+n+'-'+i).disabled=true;$('#answer'+n).textContent=g.used.map(j=>g.tokens[j]).join(' ')}
function undo(n){let g=games[n];if(g.answered||g.paused)return;let i=g.used.pop();if(i!==undefined)$('#t'+n+'-'+i).disabled=false;$('#answer'+n).textContent=g.used.map(j=>g.tokens[j]).join(' ')||'点击下方词块，拼出英文'}
function checkSentence(n){let g=games[n];let text=g.used.map(i=>g.tokens[i]).join(' ');feedback(n,text===g.tokens.join(' '),text===g.tokens.join(' ')?'句子拼好了！读一读，再继续。':'看看上面的例句，注意词序。可以撤回词块重新拼。')}
function scheduleNext(n){const g=games[n];clearTimeout(g.timer);g.timer=setTimeout(()=>{if(games[n]===g&&!g.paused&&g.answered)next(n)},1000)}
function next(n){let g=games[n];if(!g.answered||g.paused)return;clearTimeout(g.timer);g.index++;showGame(n)}

function racePool(unit,mode='words'){const u=DATA[unit],pool=new Map();for(const p of (mode==='phrases'?u.phrases:u.words))pool.set(p[0].toLowerCase(),{en:p[0],cn:p[1],source:'单元重点词汇'});if(mode==='words'){const text=u.trans.map(x=>x[0]).join(' ');for(const [en,cn]of Object.entries(BASIC_WORDS))if(new RegExp('\\b'+en+'\\b','i').test(text)&&!pool.has(en.toLowerCase()))pool.set(en.toLowerCase(),{en,cn,source:'课文基础词复习'})}return [...pool.values()]}
let race=null,raceMode='words',rankings=[],rankStorage=true;
try{const r=JSON.parse(localStorage.getItem('pep6-pairs-rank-v1')||'[]');if(Array.isArray(r))rankings=r.filter(x=>x&&typeof x.name==='string'&&Number.isFinite(x.score)&&Number.isFinite(x.seconds)&&Number.isFinite(x.unit))}catch(e){rankStorage=false}
function mix(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stopRace(){if(race){clearTimeout(race.timer);race=null}}
function raceBoard(){const rows=rankings.filter(x=>x.unit===current&&x.mode===raceMode&&x.version===racePool(current,raceMode).length).sort((a,b)=>b.score-a.score||a.seconds-b.seconds).slice(0,10);return `<div class="rank"><h2>🏆 本机挑战榜 · ${raceMode==='words'?'单词':'短语'}</h2><p class="small">同学可以轮流使用这台设备挑战。按得分排名，同分用时短者在前。${rankStorage?'成绩保存在当前浏览器。':'存储不可用，成绩仅在本次页面保留。'}</p>${rows.length?rows.map((x,i)=>`<div class="rankrow"><b>${['🥇','🥈','🥉'][i]||i+1}</b><span>${esc(x.name)}</span><strong>${x.score} 分</strong><small>${x.seconds} 秒</small></div>`).join(''):'<p>还没有成绩，来做第一位挑战者！</p>'}</div>`}
function raceMenu(){stopRace();const pool=racePool(current,raceMode);$('#app').innerHTML=`<button onclick="changeCat('words')">← 返回单元学习</button><div class="unit-title"><div><div class="eyebrow">UNIT ${current+1} · MATCH & GROW</div><h1>词汇配对赛 🌱</h1><p>${esc(DATA[current].name)} · 每配对一组，就让知识树长高一点。</p></div></div><div class="gamebar"><div><button class="${raceMode==='words'?'primary':''}" onclick="raceMode='words';raceMenu()">单词赛</button> <button class="${raceMode==='phrases'?'primary':''}" onclick="raceMode='phrases';raceMenu()">短语赛</button></div><span>${pool.length} 个词条 · 全部轮流出现</span></div><div class="race-layout"><section class="lesson"><h2>先复习，再来配对</h2><p>每轮 4 对，先点英文，再点对应中文。连续配对可获得额外奖励；配错有提示，可以继续尝试。不设倒计时，暂停不计时。</p><details><summary>展开本单元完整复习词表（${pool.length} 条）</summary><div class="review-pool">${pool.map(p=>`<div><b>${esc(p.en)}</b><span>${esc(p.cn)}</span><small>${p.source}</small></div>`).join('')}</div></details><p><label>挑战昵称（不用真实姓名）<br><input id="raceName" maxlength="12" placeholder="例如：月亮小队" autocomplete="off"></label></p><button class="primary" onclick="beginRace()">出发！开始配对 →</button><p class="small">单词赛含现有单元重点词与课文中出现的常见基础词；短语赛单列。词表供基础复习，不标作课标官方逐词清单。</p></section>${raceBoard()}</div>`}
function beginRace(){let name=$('#raceName').value.trim()||'快乐学习者';const pool=racePool(current,raceMode);race={unit:current,mode:raceMode,name,deck:mix(pool),pos:0,matched:0,combo:0,maxCombo:0,points:0,errors:0,elapsed:0,started:performance.now(),paused:false,selected:null,found:[],locked:false,state:'playing'};raceRound()}
function raceRound(){const g=race;if(!g)return;if(g.pos>=g.deck.length){finishRace();return}g.batch=g.deck.slice(g.pos,g.pos+4);g.left=mix(g.batch.map((_,i)=>i));g.right=mix(g.batch.map((_,i)=>i));g.found=[];g.selected=null;g.locked=false;renderRace()}
function renderRace(){const g=race;if(!g)return;$('#app').innerHTML=`<button onclick="raceMenu()">← 退出本次挑战</button><div class="unit-title"><div><div class="eyebrow">${esc(g.name)} · 第 ${Math.floor(g.pos/4)+1} / ${Math.ceil(g.deck.length/4)} 轮</div><h1>让词义找到朋友</h1></div><button onclick="toggleRacePause()">${g.paused?'继续':'暂停'}</button></div><div class="race-stats"><b>🌱 ${g.matched} / ${g.deck.length} 对</b><b>🔥 连击 ${g.combo}</b><b>✨ ${g.points} 能量</b></div><div class="meter"><span style="width:${g.matched/g.deck.length*100}%"></span></div>${g.paused?'<div class="lesson"><h2>休息一下 🌿</h2><p>暂停期间不计时，继续后保持原来的配对进度。</p></div>':`<div class="pair-grid"><div><h3>English</h3>${g.left.map(i=>`<button class="pair ${g.selected===i?'selected':''} ${g.found.includes(i)?'matched':''}" ${g.found.includes(i)?'disabled':''} onclick="pickEnglish(${i})">${esc(g.batch[i].en)} ${g.found.includes(i)?'✓':''}</button>`).join('')}</div><div><h3>中文词义</h3>${g.right.map(i=>`<button class="pair ${g.found.includes(i)?'matched':''}" ${g.found.includes(i)?'disabled':''} onclick="pickChinese(${i})">${esc(g.batch[i].cn)} ${g.found.includes(i)?'✓':''}</button>`).join('')}</div></div><p id="raceFeedback" class="feedback" role="status" aria-live="polite">先选一个英文词，再找它的中文朋友。</p>`}`}
function pickEnglish(i){let g=race;if(!g||g.paused||g.locked||g.found.includes(i))return;g.selected=i;renderRace()}
function pickChinese(i){const g=race;if(!g||g.paused||g.locked||g.found.includes(i))return;if(g.selected===null){$('#raceFeedback').textContent='先选择左边的英文词哦。';return}let j=g.selected;if(g.batch[j].cn!==g.batch[i].cn){g.combo=0;g.errors++;g.points=Math.max(0,g.points-20);$('#raceFeedback').textContent=`再试试：${g.batch[j].en} 的意思是「${g.batch[j].cn}」。`;return}
// Equivalent Chinese labels are accepted without consuming the wrong English card.
g.found.push(j);g.matched++;g.combo++;g.maxCombo=Math.max(g.maxCombo,g.combo);g.points+=100+Math.min(g.combo,5)*10;g.selected=null;renderRace();celebrateCorrect($('#raceFeedback'));$('#raceFeedback').textContent=`✓ 配对成功！${g.combo>=3?'连击 '+g.combo+'，太棒了！':'继续寻找下一对。'}`;if(g.found.length===g.batch.length){g.locked=true;scheduleRound()}}
function scheduleRound(){const g=race;clearTimeout(g.timer);g.timer=setTimeout(()=>{if(race!==g||g.paused)return;g.pos+=g.batch.length;raceRound()},800)}
function toggleRacePause(){const g=race;if(!g||g.state!=='playing')return;if(!g.paused){g.elapsed+=performance.now()-g.started;g.paused=true;clearTimeout(g.timer)}else{g.started=performance.now();g.paused=false;if(g.locked)scheduleRound()}renderRace()}
function finishRace(){const g=race;g.elapsed+=performance.now()-g.started;g.state='done';g.seconds=Math.max(1,Math.round(g.elapsed/1000));g.score=Math.round(g.points/(g.deck.length*150)*1000);const old=rankings.filter(x=>x.unit===g.unit&&x.mode===g.mode&&x.name===g.name&&x.version===g.deck.length).sort((a,b)=>b.score-a.score||a.seconds-b.seconds)[0];if(!old||g.score>old.score||g.score===old.score&&g.seconds<old.seconds){rankings=rankings.filter(x=>!(x.unit===g.unit&&x.mode===g.mode&&x.name===g.name&&x.version===g.deck.length));rankings.push({unit:g.unit,mode:g.mode,name:g.name,score:g.score,seconds:g.seconds,version:g.deck.length});try{localStorage.setItem('pep6-pairs-rank-v1',JSON.stringify(rankings))}catch(e){rankStorage=false}}$('#app').innerHTML=`<button onclick="raceMenu()">← 配对赛大厅</button><section class="lesson finish"><div style="font-size:60px">🌳</div><h1>整棵知识树，点亮了！</h1><p>${esc(g.name)}，本次复习了 ${g.deck.length} 个词条。</p><h2>${g.score} 分 · ${g.seconds} 秒</h2><p>最高连击 ${g.maxCombo} · 配错 ${g.errors} 次</p><p class="small">每对 100 能量，连击另奖 10–50；配错扣 20（最低 0）。总能量折算为千分制；同昵称保留本单元、本模式最好成绩。</p><button class="primary" onclick="raceMenu()">换位同学 / 再挑战 ↻</button></section>${raceBoard()}`}
const originalRenderText=window.render_game_to_text;window.render_game_to_text=()=>JSON.stringify({lesson:JSON.parse(originalRenderText()),race:race?{state:race.state,matched:race.matched,total:race.deck.length,round:race.pos,combo:race.combo,paused:race.paused,batch:race.batch,selected:race.selected}:null});

home();
</script></html>
