, "我上个星期六去参观了“姜饼屋”。"], ["Where did you go over the summer holidays, Binbin?", "你暑假去哪儿了，斌斌？"], ["I went to Xi'an with my family.", "我和家人去西安了。"], ["What did you do there?", "你们在那儿做了什么？"], ["We went to see the Terracotta Warriors.", "我们去看兵马俑了。"], ["What else did you do?", "你们还做了什么？"], ["We walked around the old city and rode bikes on the old city wall.", "我们逛了古城，还在古城墙上骑了自行车。"], ["How was your trip to the West Lake?", "你去西湖的旅行怎么样？"], ["It was such a nice trip.", "那是一次非常愉快的旅行。"]], "trans": [["How was your weekend?", "你周末过得怎么样？"], ["Not too bad, thanks. And you?", "还不错，谢谢。你呢？"], ["It was great! I climbed the Great Wall.", "非常棒！我去爬长城了。"], ["Wow! The Great Wall is amazing.", "哇！长城太壮观了。"], ["Yes, it is! It's 21,000 kilometres in all.", "是的！它全长两万一千千米。"], ["What did you do, Peter?", "你做什么了，彼得？"], ["I visited the \"Gingerbread House\" last Saturday.", "我上个星期六去参观了“姜饼屋”。"], ["What did you do there? Eat gingerbread?", "你在那儿做什么了？吃姜饼吗？"], ["Ha! Ha! No! It's a beautiful train station in New Zealand.", "哈哈！不是！它是新西兰一座很漂亮的火车站。"], ["That sounds interesting. Please send me some pictures.", "听起来很有趣。请给我发一些照片吧。"], ["Where did you go over the summer holidays, Binbin?", "斌斌，你暑假去哪儿了？"], ["I went to Xi'an with my family.", "我和家人去西安了。"], ["I like Xi'an very much. What did you do there?", "我非常喜欢西安。你们在那儿做了什么？"], ["We ate some famous Xi'an noodles. Then we went to see the Terracotta Warriors.", "我们吃了有名的西安面条，然后去看了兵马俑。"], ["Wow! I really want to go there! How was it?", "哇！我真想去那儿！那里怎么样？"], ["Amazing! There are over seven thousand clay warriors and one hundred horses.", "太棒了！有七千多个陶俑和一百匹马。"], ["I saw pictures on the internet. What else did you do?", "我在网上看过照片。你们还做了什么？"], ["Well, we walked around the old city and rode bikes on the old city wall.", "嗯，我们逛了古城，还在古城墙上骑了自行车。"], ["That sounds great fun!", "听起来太好玩了！"], ["Amy walked around the Palace Museum for hours.", "埃米在故宫博物院逛了好几个小时。"], ["Mike visited the Hong Kong-Zhuhai-Macao Bridge.", "迈克参观了港珠澳大桥。"], ["Zhang Peng climbed Mount Taishan.", "张鹏爬了泰山。"], ["Liu  Guangzhou and visited the Guangdong Science Centre.", "我去广州旅行，参观了广东科学中心。"], ["Where did you go, Zhang Peng and Amy?", "张鹏、埃米，你们去哪儿了？"], ["I took a trip to Guangzhou.", "我去广州旅行了。"], ["I went to Hangzhou and Shaoxing. I went to visit the former home of Lu Xun. He was a famous writer.", "我去了杭州和绍兴。我去参观了鲁迅故居。他是一位著名的作家。"], ["Yes, he was. He wrote a lot of great books.", "是的。他写了很多好书。"], ["We walked to the West Lake.", "我们步行去了西湖。"], ["We went boating and took nice photos.", "我们去划船，拍了好看的照片。"], ["We went to a famous restaurant. We drank Longjing tea, ate Dongpo pork and Jiao Hua Ji.", "我们去了家有名的餐馆，喝了龙井茶，吃了东坡肉和叫花鸡。"], ["We climbed Baoshi Hill and watched the sunrise.", "我们爬了宝石山，看了日出。"], ["We saw lots of fish in Fish Viewing at the Flower Pond.", "我们在花港观鱼看到了很多鱼。"], ["We visited the former home of Lu Xun and the Herb Garden.", "我们参观了鲁迅故居和百草园。"], ["Lu Xun was a famous writer. He wrote a lot of great books.", "鲁迅是著名作家，他写了很多好书。"], ["I had great fun with my family last summer holidays.", "去年暑假我和家人玩得非常开心。"], ["My last trip to Sanxingdui was great!", "我上次的三星堆之旅太棒了！"], ["In the Sanxingdui Museum, I saw strange masks, the \"big guy\" statue and a life-size \"fruit\" tree Lamp.", "在三星堆博物馆，我看到了奇特的面具、“大立人”雕像和一盏真人大小的“神树”灯。"], ["Some believed people from Sanxingdui were aliens. But it's not true.", "有些人认为三星堆人是外星人，但这不是真的。"], ["They might eat hotpot three thousand years ago, just like we do today.", "三千年前他们可能就像我们今天一样吃火锅。"], ["I visited the West Lake last autumn.", "去年秋天我游览了西湖。"], ["On the first night, my friends and I watched the moon rising from a boat on the lake.", "第一个晚上，我和朋友们在湖上泛舟看月亮升起。"], ["We ate mooncakes and drank Longjing tea.", "我们吃了月饼，喝了龙井茶。"], ["The next day we walked along the lake. It was such a nice trip.", "第二天我们沿着湖边散步。那是一次非常愉快的旅行。"], ["On Easter Island, I saw huge statues called Moai.", "在复活节岛，我看到了叫摩艾的巨大石像。"], ["The Rapa Nui people made them thousands of years ago.", "拉帕努伊人数千年前制作了它们。"], ["I loved the food on the island. The locals cooked fresh food on rocks! We had fish. It was so delicious!", "我喜欢岛上的食物。当地人用石头烹制新鲜食物！我们吃了鱼，太好吃了！"], ["I climbed many mountains on my trips, but Table Mountain in South Africa was a special one.", "我旅行时爬过很多山，但南非的桌山很特别。"], ["Its name comes from its top. It is flat like a table!", "它的名字来自山顶。山顶像桌子一样平坦！"], ["But I found it only looks flat from one side.", "但我发现它只有从一面看才是平的。"], ["I went to the top by cable car. The first cable car opened in 1929.", "我坐缆车到了山顶。第一条缆车于1929年开通。"], ["The view was so amazing!", "景色太美了！"]], "verbs": [["be (am, is, are)", "was, were"], ["make", "made"], ["see", "saw"], ["do", "did"], ["drink", "drank"], ["eat", "ate"], ["find", "found"], ["take", "took"], ["tell", "told"], ["go", "went"], ["have (has)", "had"], ["write", "wrote"], ["", ""]], "grammar": [["was / were", "am、is 的过去式是 was；are 的过去式是 were。", "My weekend ___ great.", "was", ["were", "is"], "时间在过去，主语 my weekend 是单数。"], ["过去的动作", "描述过去做过的事，用动词过去式。", "We ___ the Great Wall last Saturday.", "climbed", ["climb", "climbing"], "last Saturday 表示过去；climb → climbed。"], ["询问过去做了什么", "What / Where + did + 主语 + 动词原形？", "Where did you ___?", "go", ["went", "going"], "did 已表示过去，后面的 go 用原形。"]], "passages": [{"title": "周末见闻：长城与姜饼屋", "items": [["How was your weekend?", "你周末过得怎么样？"], ["Not too bad, thanks. And you?", "还不错，谢谢。你呢？"], ["It was great! I climbed the Great Wall.", "非常棒！我去爬长城了。"], ["Wow! The Great Wall is amazing.", "哇！长城太壮观了。"], ["Yes, it is! It's 21,000 kilometres in all.", "是的！它全长两万一千千米。"], ["What did you do, Peter?", "你做什么了，彼得？"], ["I visited the \"Gingerbread House\" last Saturday.", "我上个星期六去参观了“姜饼屋”。"], ["What did you do there? Eat gingerbread?", "你在那儿做什么了？吃姜饼吗？"], ["Ha! Ha! No! It's a beautiful train station in New Zealand.", "哈哈！不是！它是新西兰一座很漂亮的火车站。"], ["That sounds interesting. Please send me some pictures.", "听起来很有趣。请给我发一些照片吧。"]]}, {"title": "暑假西安之旅", "items": [["Where did you go over the summer holidays, Binbin?", "斌斌，你暑假去哪儿了？"], ["I went to Xi'an with my family.", "我和家人去西安了。"], ["I like Xi'an very much. What did you do there?", "我非常喜欢西安。你们在那儿做了什么？"], ["We ate some famous Xi'an noodles. Then we went to see the Terracotta Warriors.", "我们吃了有名的西安面条，然后去看了兵马俑。"], ["Wow! I really want to go there! How was it?", "哇！我真想去那儿！那里怎么样？"], ["Amazing! There are over seven thousand clay warriors and one hundred horses.", "太棒了！有七千多个陶俑和一百匹马。"], ["I saw pictures on the internet. What else did you do?", "我在网上看过照片。你们还做了什么？"], ["Well, we walked around the old city and rode bikes on the old city wall.", "嗯，我们逛了古城，还在古城墙上骑了自行车。"], ["That sounds great fun!", "听起来太好玩了！"]]}, {"title": "Let's learn · 照片展示（p.5 / p.7）", "items": [["Amy walked around the Palace Museum for hours.", "埃米在故宫博物院逛了好几个小时。"], ["Mike visited the Hong Kong-Zhuhai-Macao Bridge.", "迈克参观了港珠澳大桥。"], ["Zhang Peng climbed Mount Taishan.", "张鹏爬了泰山。"], ["Liu Jia's family traveled to Paris and visited the Eiffel Tower.", "刘佳的家人去巴黎旅行，参观了埃菲尔铁塔。"], ["Oliver and his cousin watched a show at the Sydney Opera House.", "奥利弗和他的表弟在悉尼歌剧院看了一场演出。"], ["What did they do last summer holidays?", "他们去年暑假做了什么？"], ["I visited a great place last Saturday.", "我上周六参观了一个很棒的地方。"], ["Really? Tell me about it.", "真的吗？给我讲讲。"], ["I climbed Mount Huangshan. I watched the sunrise.", "我爬了黄山，看了日出。"], ["Binbin and Xinxin went to the village nearby. They saw beautiful flowers.", "斌斌和欣欣去了附近的村庄。他们看到了漂亮的花。"], ["Sarah went to Wuhan. She ate hot dry noodles.", "萨拉去了武汉。她吃了热干面。"], ["Amy took a trip to Shanghai. The view from the tower was great.", "埃米去上海旅行了。从塔上看到的景色很棒。"], ["Chen Jie took a trip to Singapore City. She took nice photos there.", "陈杰去新加坡旅行了。她在那里拍了好看的照片。"], ["Where did you go over the holidays?", "假期你去了哪里？"], ["I went to Wuhan. I ate hot dry noodles.", "我去了武汉，吃了热干面。"], ["Last week my family took a trip to a village nearby.", "上周我们全家去附近的村庄旅行了。"], ["It was warm and sunny.", "天气温暖又晴朗。"], ["We saw many ducks and ate fresh fruit there.", "我们在那里看到许多鸭子，还吃了新鲜水果。"]]}, {"title": "Read and write · 井冈山游记（p.8）", "items": [["My trip to the Jinggangshan Revolution Museum was amazing!", "我的井冈山革命博物馆之旅太棒了！"], ["I walked around the museum for hours and saw many old books and photos.", "我在博物馆里逛了好几个小时，看了很多旧书和照片。"], ["The volunteers told great stories about the Red Army.", "志愿者讲了很多关于红军的精彩故事。"], ["The stories were really inspiring. I learnt a lot.", "这些故事非常鼓舞人心。我学到了很多。"], ["Do you want to learn more about the Red Army? You should go there!", "你想了解更多关于红军的事吗？你应该去那里！"], ["This was a great place for a summer trip!", "这真是个适合夏日旅行的好地方！"], ["We climbed the Jinggang Mountains and took many photos of the bamboo forest and beautiful waterfalls.", "我们爬了井冈山，拍了很多竹林和美丽瀑布的照片。"], ["We tried delicious pumpkin soup and red rice in a nice restaurant too.", "我们还在一家不错的餐馆尝了美味的南瓜汤和红米饭。"], ["The Jinggang Mountains are only about 1.5 hours from the airport by bus.", "井冈山离机场坐大巴只有大约1.5小时。"], ["I want to go there again!", "我想再去一次！"]]}, {"title": "Project · 假日剪贴簿（p.10-11）", "items": [["I took a trip to Guangzhou and visited the Guangdong Science Centre.", "我去广州旅行，参观了广东科学中心。"], ["Where did you go, Zhang Peng and Amy?", "张鹏、埃米，你们去哪儿了？"], ["I took a trip to Guangzhou.", "我去广州旅行了。"], ["I went to Hangzhou and Shaoxing. I went to visit the former home of Lu Xun. He was a famous writer.", "我去了杭州和绍兴。我去参观了鲁迅故居。他是一位著名的作家。"], ["Yes, he was. He wrote a lot of great books.", "是的。他写了很多好书。"], ["We walked to the West Lake.", "我们步行去了西湖。"], ["We went boating and took nice photos.", "我们去划船，拍了好看的照片。"], ["We went to a famous restaurant. We drank Longjing tea, ate Dongpo pork and Jiao Hua Ji.", "我们去了家有名的餐馆，喝了龙井茶，吃了东坡肉和叫花鸡。"], ["We climbed Baoshi Hill and watched the sunrise.", "我们爬了宝石山，看了日出。"], ["We saw lots of fish in Fish Viewing at the Flower Pond.", "我们在花港观鱼看到了很多鱼。"], ["We visited the former home of Lu Xun and the Herb Garden.", "我们参观了鲁迅故居和百草园。"], ["Lu Xun was a famous writer. He wrote a lot of great books.", "鲁迅是著名作家，他写了很多好书。"], ["I had great fun with my family last summer holidays.", "去年暑假我和家人玩得非常开心。"]]}, {"title": "Reading time · 不容错过的地标（p.12-13）", "items": [["My last trip to Sanxingdui was great!", "我上次的三星堆之旅太棒了！"], ["In the Sanxingdui Museum, I saw strange masks, the \"big guy\" statue and a life-size \"fruit\" tree Lamp.", "在三星堆博物馆，我看到了奇特的面具、“大立人”雕像和一盏真人大小的“神树”灯。"], ["Some believed people from Sanxingdui were aliens. But it's not true.", "有些人认为三星堆人是外星人，但这不是真的。"], ["They might eat hotpot three thousand years ago, just like we do today.", "三千年前他们可能就像我们今天一样吃火锅。"], ["I visited the West Lake last autumn.", "去年秋天我游览了西湖。"], ["On the first night, my friends and I watched the moon rising from a boat on the lake.", "第一个晚上，我和朋友们在湖上泛舟看月亮升起。"], ["We ate mooncakes and drank Longjing tea.", "我们吃了月饼，喝了龙井茶。"], ["The next day we walked along the lake. It was such a nice trip.", "第二天我们沿着湖边散步。那是一次非常愉快的旅行。"], ["On Easter Island, I saw huge statues called Moai.", "在复活节岛，我看到了叫摩艾的巨大石像。"], ["The Rapa Nui people made them thousands of years ago.", "拉帕努伊人数千年前制作了它们。"], ["I loved the food on the island. The locals cooked fresh food on rocks! We had fish. It was so delicious!", "我喜欢岛上的食物。当地人用石头烹制新鲜食物！我们吃了鱼，太好吃了！"], ["I climbed many mountains on my trips, but Table Mountain in South Africa was a special one.", "我旅行时爬过很多山，但南非的桌山很特别。"], ["Its name comes from its top. It is flat like a table!", "它的名字来自山顶。山顶像桌子一样平坦！"], ["But I found it only looks flat from one side.", "但我发现它只有从一面看才是平的。"], ["I went to the top by cable car. The first cable car opened in 1929.", "我坐缆车到了山顶。第一条缆车于1929年开通。"], ["The view was so amazing!", "景色太美了！"]]}]}, {"name": "Getting together", "cn": "欢聚时光", "words": [["dress", "穿衣服", "/dres/"], ["paste", "粘贴", "/peɪst/"], ["gala", "演出；庆典", "/ˈɡɑːlə/"], ["count down", "倒计时", "/kaʊnt daʊn/"], ["marathon", "马拉松赛跑", "/ˈmærəθən/"], ["as", "作为", "/æz/"], ["race", "赛跑；速度竞赛", "/reɪs/"], ["run", "跑；奔跑（过去式 ran）", "/rʌn/"], ["cheer", "欢呼；加油", "/tʃɪə(r)/"], ["book fair", "书市", "/bʊk feə(r)/"], ["writer", "作家；作者", "/ˈraɪtə(r)/"], ["read", "阅读（过去式 read）", "/riːd/"], ["make", "做；使出现（过去式 made）", "/meɪk/"], ["sing", "唱（歌）（过去式 sang）", "/sɪŋ/"], ["wear", "穿；戴（过去式 wore）", "/weə(r)/"], ["yesterday", "昨天", "/ˈjestədeɪ/"], ["notice", "通知", "/ˈnəʊtɪs/"], ["wake", "醒；醒来（过去式 woke）", "/weɪk/"], ["later", "随后；后来", "/ˈleɪtə(r)/"], ["judge", "裁判", "/dʒʌdʒ/"], ["begin", "开始（过去式 began）", "/bɪˈɡɪn/"], ["win", "获胜（过去式 won）", "/wɪn/"], ["winner", "获胜的人（或队）；成功者", "/ˈwɪnə(r)/"], ["ever", "（加强语气）以往任何时候", "/ˈevə(r)/"], ["exciting", "令人激动的", "/ɪkˈsaɪtɪŋ/"]], "phrases": [["have breakfast", "吃早餐"], ["Mid-Autumn Festival holiday", "中秋节假期"], ["take a trip", "去旅行"], ["eat mooncakes", "吃月饼"], ["enjoy some mooncakes and fruit", "享用一些月饼和水果"], ["tell stories", "讲故事"], ["eat jiaozi together", "一起吃饺子"], ["make cards", "制作贺卡"], ["clean the house", "打扫房子"], ["paste fu on the door", "在门上贴“福”字"], ["dress in red", "穿红色衣服"], ["wait for the Spring Festival Gala", "等待春节联欢晚会"], ["count down to the new year", "倒计时迎接新年"], ["work as a volunteer", "做志愿者"], ["watch the race", "观看比赛"], ["cheer for the runners", "为跑步者加油"], ["hike in the mountains", "在山里徒步旅行"], ["put up a camp", "搭帐篷"], ["go camping together", "一起去露营"], ["dragon boat race", "龙舟赛"], ["on a race team", "在一个参赛队里"], ["wake up early", "早起"], ["win the race", "赢得比赛"], ["make zongzi", "包粽子"], ["Children's Day / National Day / Teachers' Day", "儿童节 / 国庆节 / 教师节"], ["Dragon Boat Festival / Lantern Festival", "端午节 / 元宵节"]], "patterns": [["Did you take a trip?", "你们去旅行了吗？"], ["No, we didn't.", "不，我们没有。"], ["Did you eat mooncakes?", "你们吃月饼了吗？"], ["Yes, we did.", "是的，吃了。"], ["What did you like about it?", "你喜欢这个活动的哪个方面？"], ["I liked watching the runners.", "我喜欢看参赛者跑步。"], ["What did you do last weekend?", "你上周末做什么了？"], ["I joined an online book fair.", "我参加了一个线上书展。"], ["I ran and cheered for my dad.", "我跑着为爸爸加油。两个动作都要用过去式。"], ["Children wore beautiful clothes on National Day.", "孩子们在国庆节穿上漂亮的衣服。on Earth Day / on Sunday / on October 1st"]], "trans": [["How was your Mid-Autumn Festival holiday, Binbin?", "斌斌，你中秋假期过得怎么样？"], ["It was great! My family and I had a really nice day.", "非常棒！我和家人度过了非常愉快的一天。"], ["What did you do? Did you take a trip?", "你们做了什么？去旅行了吗？"], ["No, we didn't. My aunt's family visited us.", "没有。我姑姑一家来看我们了。"], ["Did you eat mooncakes?", "你们吃月饼了吗？"], ["Yes, we did. We enjoyed some mooncakes and fruit. Grandpa told us some stories about the festival.", "是的，吃了。我们享用了月饼和水果。爷爷给我们讲了一些关于这个节日的故事。"], ["Wow! Can I join you next year?", "哇！明年我能和你们一起吗？"], ["Sure. You can also join us for the Spring Festival. We can paste fu and eat jiaozi together.", "当然。你还可以和我们一起过春节。我们可以一起贴“福”字、吃饺子。"], ["Great! I can't wait!", "太棒了！我等不及了！"], ["Did you draw pictures for our teachers?", "你们给老师们画画了吗？"], ["No, I didn't. I took some photos. Did you make cards for our teachers?", "没有，我拍了一些照片。你们给老师做贺卡了吗？"], ["Yes, I did.", "是的，做了。"], ["How was your weekend, Amy?", "埃米，你周末过得怎么样？"], ["It was great. My mother and I went to a marathon on Sunday. She worked as a volunteer. I watched the race.", "非常棒。我和妈妈周日去参加了马拉松活动。她当志愿者，我看比赛。"], ["What did you like about it?", "你喜欢这个活动的哪个方面？"], ["I liked watching the runners. They ran very fast. I cheered for them.", "我喜欢看参赛者跑步。他们跑得很快，我为他们加油。"], ["Nice! And you, Chen Jie? What did you do last weekend?", "很好！你呢，陈杰？你上周末做了什么？"], ["I joined an online book fair. I liked it very much.", "我参加了一个线上书展。我非常喜欢。"], ["We shared ideas and talked about different books online.", "我们在网上分享想法，讨论不同的书。"], ["That sounds fun!", "听起来很有趣！"], ["My dad and I cleaned the house.", "我和爸爸打扫了房子。"], ["My sister and I pasted fu on the door.", "我和妹妹在门上贴了“福”字。"], ["We dressed in red.", "我们穿上了红色的衣服。"], ["We waited for the Spring Festival Gala.", "我们等着看春节联欢晚会。"], ["We counted down to the new year.", "我们倒计时迎接新年。"], ["What did you do for the Spring Festival?", "春节你做了什么？"], ["Xinxin and I pasted fu on the door.", "欣欣和我在门上贴了“福”字。"], ["Did you eat mooncakes? — No, we didn't. / Did you count down to 12 o'clock? — Yes, we did.", "你们吃月饼了吗？——没有。你们倒计时到12点了吗？——是的。"], ["Oh, it's the Spring Festival.", "哦，是春节。"], ["The writer read his book to the children.", "作家给孩子们读他的书。"], ["People from different places ran a marathon.", "来自不同地方的人跑了马拉松。"], ["Students made different robots.", "学生们制作了不同的机器人。"], ["Children sang and danced in an art festival.", "孩子们在艺术节上唱歌跳舞。"], ["Children wore beautiful clothes on National Day.", "孩子们在国庆节穿上漂亮的衣服。"], ["Did you go to the book fair yesterday? — Yes, I did.", "你昨天去书展了吗？——是的，去了。"], ["Students in Class One did fun activities on Earth Day. They went camping together. Some students put up a camp and ...", "一班的学生在地球日做了有趣的活动。他们一起去露营。有些学生搭起了帐篷……"], ["The notice about the dragon boat race finally came out last Friday.", "关于龙舟赛的通知上周五终于出来了。"], ["I was excited because my father was on a race team!", "我很激动，因为我爸爸在一支参赛队里！"], ["In the morning, my dad woke up early. We went to the river later and waited for the race.", "早上我爸爸很早就醒了。我们后来去了河边，等着比赛开始。"], ["Then the judge counted down and the race began!", "然后裁判倒计时，比赛开始了！"], ["I ran and cheered for my dad. His boat was very fast.", "我跑着为爸爸加油。他的船很快。"], ["Finally, his team won the race!", "最后，他的队赢得了比赛！"], ["They all sang their team song together. They were so happy!", "他们一起唱了队歌。他们太开心了！"], ["In the evening, our family made zongzi and had a big dinner for the festival, and for the winner, my dad!", "晚上，我们全家包粽子，为节日和获胜者——我爸爸，吃了一顿丰盛的晚餐！"], ["It was the best Dragon Boat Festival ever!", "这是有史以来最好的端午节！"], ["Love boats? Like exciting races? The Dragon Boat Festival is coming. Come and join us!", "喜欢船吗？喜欢激动人心的比赛吗？端午节快到了。快来加入我们吧！"], ["Time: 8:30 a.m. Sunday. Place: Xingfu River.", "时间：周日上午8:30。地点：幸福河。"], ["Are these photos from the Double Ninth Festival this year?", "这些是今年重阳节的照片吗？"], ["Yes, they are.", "是的。"], ["Did the old people have a good time?", "老人们玩得开心吗？"], ["Yes, they did.", "是的，很开心。"], ["What did they like about it?", "他们喜欢什么？"], ["Chen Jie and Liu Xin played the pipa to greet the old people.", "陈杰和刘欣弹琵琶欢迎老人们。"], ["Mike and John did wonderful kung fu. What a great show!", "迈克和约翰表演了精彩的功夫。多棒的演出啊！"], ["These are snapshots from ...", "这些是……的照片。"], ["One night, an old man came to a village. He saw the local people running away.", "一天晚上，一位老人来到一个村庄。他看到当地人正在逃跑。"], ["Excuse me, why are you running? What happened?", "请问，你们为什么跑？发生什么事了？"], ["The monster Nian will come! Last year, it ate many animals. We are all afraid of it.", "年兽要来了！去年它吃了很多动物。我们都害怕它。"], ["Wait! I have a good idea. I can help you!", "等等！我有好主意。我能帮你们！"], ["The monster is very strong. You should run away to the mountains with us!", "年兽非常强壮。你应该和我们一起跑到山里去！"], ["No. I will stay alone in the village and face Nian.", "不。我要独自留在村里面对年兽。"], ["The old man stayed in the village. Then, at midnight, the monster came.", "老人留在村里。然后，半夜时分，年兽来了。"], ["What is that red paper on the doors and windows? I hate the colour red!", "门和窗户上的红纸是什么？我讨厌红色！"], ["Why are the windows so bright? I hate bright lights!", "窗户为什么这么亮？我讨厌亮光！"], ["Aha! He looks worried.", "啊哈！他看起来很担心。"], ["Then the old man set off fireworks. Bang! Bang! Bang!", "然后老人放起了烟花。砰！砰！砰！"], ["Oh no! I hate loud noises! No, no!", "哦不！我讨厌巨响！不，不！"], ["Nian was very afraid and ran back to the sea. The next day, the villagers came back to the village.", "年兽非常害怕，跑回了海里。第二天，村民们回到了村庄。"], ["I can't believe it! All our animals are safe!", "我简直不敢相信！我们所有的动物都安全！"], ["How did you do it?", "你是怎么做到的？"], ["Last night, I pasted red paper on the doors and windows and I also lit many candles. Finally, I set off fireworks. He ran away!", "昨晚，我在门和窗户上贴了红纸，还点亮了很多蜡烛。最后，我放了烟花。他跑掉了！"], ["Hooray! We are safe!", "万岁！我们安全了！"], ["From then on, on New Year's Eve, people get together to celebrate the coming new year. They paste fu and Spring Festival couplets on their doors and set off fireworks.", "从那时起，除夕夜人们聚在一起庆祝新年的到来。他们在门上贴“福”字和春联，放烟花。"], ["This is why the Spring Festival is also called guonian.", "这就是为什么春节也叫“过年”。"]], "verbs": [["be (am, is, are)", "was, were"], ["make", "made"], ["begin", "began"], ["put", "put"], ["read", "read"], ["run", "ran"], ["come", "came"], ["see", "saw"], ["do", "did"], ["sing", "sang"], ["eat", "ate"], ["take", "took"], ["tell", "told"], ["go", "went"], ["have (has)", "had"], ["wake", "woke"], ["wear", "wore"], ["win", "won"], ["", ""]], "grammar": [["Did 问句", "Did + 主语 + 动词原形？Yes, ... did. / No, ... didn’t.", "Did you ___ mooncakes?", "eat", ["ate", "eating"], "Did 后面用动词原形 eat。"], ["两个过去动作", "and 连接的两个过去动作都用过去式。", "I ran and ___ for my dad.", "cheered", ["cheer", "cheering"], "ran 和 cheered 都是过去的动作。"], ["节日与日期", "表示在具体某一天，通常用 on。", "Children wore beautiful clothes ___ National Day.", "on", ["in", "at"], "on + 具体节日或日期。"]], "passages": [{"title": "中秋节团聚", "items": [["How was your Mid-Autumn Festival holiday, Binbin?", "斌斌，你中秋假期过得怎么样？"], ["It was great! My family and I had a really nice day.", "非常棒！我和家人度过了非常愉快的一天。"], ["What did you do? Did you take a trip?", "你们做了什么？去旅行了吗？"], ["No, we didn't. My aunt's family visited us.", "没有。我姑姑一家来看我们了。"], ["Did you eat mooncakes?", "你们吃月饼了吗？"], ["Yes, we did. We enjoyed some mooncakes and fruit. Grandpa told us some stories about the festival.", "是的，吃了。我们享用了月饼和水果。爷爷给我们讲了一些关于这个节日的故事。"], ["Wow! Can I join you next year?", "哇！明年我能和你们一起吗？"], ["Sure. You can also join us for the Spring Festival. We can paste fu and eat jiaozi together.", "当然。你还可以和我们一起过春节。我们可以一起贴“福”字、吃饺子。"], ["Great! I can't wait!", "太棒了！我等不及了！"]]}, {"title": "教师节的准备", "items": [["Did you draw pictures for our teachers?", "你们给老师们画画了吗？"], ["No, I didn't. I took some photos. Did you make cards for our teachers?", "没有，我拍了一些照片。你们给老师做贺卡了吗？"], ["Yes, I did.", "是的，做了。"]]}, {"title": "周末活动：马拉松与书展", "items": [["How was your weekend, Amy?", "埃米，你周末过得怎么样？"], ["It was great. My mother and I went to a marathon on Sunday. She worked as a volunteer. I watched the race.", "非常棒。我和妈妈周日去参加了马拉松活动。她当志愿者，我看比赛。"], ["What did you like about it?", "你喜欢这个活动的哪个方面？"], ["I liked watching the runners. They ran very fast. I cheered for them.", "我喜欢看参赛者跑步。他们跑得很快，我为他们加油。"], ["Nice! And you, Chen Jie? What did you do last weekend?", "很好！你呢，陈杰？你上周末做了什么？"], ["I joined an online book fair. I liked it very much.", "我参加了一个线上书展。我非常喜欢。"], ["We shared ideas and talked about different books online.", "我们在网上分享想法，讨论不同的书。"], ["That sounds fun!", "听起来很有趣！"]]}, {"title": "Let's learn · 春节与活动（p.17 / p.19）", "items": [["My dad and I cleaned the house.", "我和爸爸打扫了房子。"], ["My sister and I pasted fu on the door.", "我和妹妹在门上贴了“福”字。"], ["We dressed in red.", "我们穿上了红色的衣服。"], ["We waited for the Spring Festival Gala.", "我们等着看春节联欢晚会。"], ["We counted down to the new year.", "我们倒计时迎接新年。"], ["What did you do for the Spring Festival?", "春节你做了什么？"], ["Xinxin and I pasted fu on the door.", "欣欣和我在门上贴了“福”字。"], ["Did you eat mooncakes? — No, we didn't. / Did you count down to 12 o'clock? — Yes, we did.", "你们吃月饼了吗？——没有。你们倒计时到12点了吗？——是的。"], ["Oh, it's the Spring Festival.", "哦，是春节。"], ["The writer read his book to the children.", "作家给孩子们读他的书。"], ["People from different places ran a marathon.", "来自不同地方的人跑了马拉松。"], ["Students made different robots.", "学生们制作了不同的机器人。"], ["Children sang and danced in an art festival.", "孩子们在艺术节上唱歌跳舞。"], ["Children wore beautiful clothes on National Day.", "孩子们在国庆节穿上漂亮的衣服。"], ["Did you go to the book fair yesterday? — Yes, I did.", "你昨天去书展了吗？——是的，去了。"], ["Students in Class One did fun activities on Earth Day. They went camping together. Some students put up a camp and ...", "一班的学生在地球日做了有趣的活动。他们一起去露营。有些学生搭起了帐篷……"]]}, {"title": "Read and write · 龙舟赛日记与通知（p.20）", "items": [["The notice about the dragon boat race finally came out last Friday.", "关于龙舟赛的通知上周五终于出来了。"], ["I was excited because my father was on a race team!", "我很激动，因为我爸爸在一支参赛队里！"], ["In the morning, my dad woke up early. We went to the river later and waited for the race.", "早上我爸爸很早就醒了。我们后来去了河边，等着比赛开始。"], ["Then the judge counted down and the race began!", "然后裁判倒计时，比赛开始了！"], ["I ran and cheered for my dad. His boat was very fast.", "我跑着为爸爸加油。他的船很快。"], ["Finally, his team won the race!", "最后，他的队赢得了比赛！"], ["They all sang their team song together. They were so happy!", "他们一起唱了队歌。他们太开心了！"], ["In the evening, our family made zongzi and had a big dinner for the festival, and for the winner, my dad!", "晚上，我们全家包粽子，为节日和获胜者——我爸爸，吃了一顿丰盛的晚餐！"], ["It was the best Dragon Boat Festival ever!", "这是有史以来最好的端午节！"], ["Love boats? Like exciting races? The Dragon Boat Festival is coming. Come and join us!", "喜欢船吗？喜欢激动人心的比赛吗？端午节快到了。快来加入我们吧！"], ["Time: 8:30 a.m. Sunday. Place: Xingfu River.", "时间：周日上午8:30。地点：幸福河。"]]}, {"title": "Project · 校园活动快照（p.22-23）", "items": [["Are these photos from the Double Ninth Festival this year?", "这些是今年重阳节的照片吗？"], ["Yes, they are.", "是的。"], ["Did the old people have a good time?", "老人们玩得开心吗？"], ["Yes, they did.", "是的，很开心。"], ["What did they like about it?", "他们喜欢什么？"], ["Chen Jie and Liu Xin played the pipa to greet the old people.", "陈杰和刘欣弹琵琶欢迎老人们。"], ["Mike and John did wonderful kung fu. What a great show!", "迈克和约翰表演了精彩的功夫。多棒的演出啊！"], ["These are snapshots from ...", "这些是……的照片。"]]}, {"title": "Reading time · 年兽的故事（p.24-25）", "items": [["One night, an old man came to a village. He saw the local people running away.", "一天晚上，一位老人来到一个村庄。他看到当地人正在逃跑。"], ["Excuse me, why are you running? What happened?", "请问，你们为什么跑？发生什么事了？"], ["The monster Nian will come! Last year, it ate many animals. We are all afraid of it.", "年兽要来了！去年它吃了很多动物。我们都害怕它。"], ["Wait! I have a good idea. I can help you!", "等等！我有好主意。我能帮你们！"], ["The monster is very strong. You should run away to the mountains with us!", "年兽非常强壮。你应该和我们一起跑到山里去！"], ["No. I will stay alone in the village and face Nian.", "不。我要独自留在村里面对年兽。"], ["The old man stayed in the village. Then, at midnight, the monster came.", "老人留在村里。然后，半夜时分，年兽来了。"], ["What is that red paper on the doors and windows? I hate the colour red!", "门和窗户上的红纸是什么？我讨厌红色！"], ["Why are the windows so bright? I hate bright lights!", "窗户为什么这么亮？我讨厌亮光！"], ["Aha! He looks worried.", "啊哈！他看起来很担心。"], ["Then the old man set off fireworks. Bang! Bang! Bang!", "然后老人放起了烟花。砰！砰！砰！"], ["Oh no! I hate loud noises! No, no!", "哦不！我讨厌巨响！不，不！"], ["Nian was very afraid and ran back to the sea. The next day, the villagers came back to the village.", "年兽非常害怕，跑回了海里。第二天，村民们回到了村庄。"], ["I can't believe it! All our animals are safe!", "我简直不敢相信！我们所有的动物都安全！"], ["How did you do it?", "你是怎么做到的？"], ["Last night, I pasted red paper on the doors and windows and I also lit many candles. Finally, I set off fireworks. He ran away!", "昨晚，我在门和窗户上贴了红纸，还点亮了很多蜡烛。最后，我放了烟花。他跑掉了！"], ["Hooray! We are safe!", "万岁！我们安全了！"], ["From then on, on New Year's Eve, people get together to celebrate the coming new year. They paste fu and Spring Festival couplets on their doors and set off fireworks.", "从那时起，除夕夜人们聚在一起庆祝新年的到来。他们在门上贴“福”字和春联，放烟花。"], ["This is why the Spring Festival is also called guonian.", "这就是为什么春节也叫“过年”。"]]}]}, {"name": "Healthy life", "cn": "健康生活", "words": [["cold", "感冒", "/kəʊld/"], ["ill", "不舒服；有病", "/ɪl/"], ["head", "头；头部", "/hed/"], ["runny nose", "流鼻涕", "/ˈrʌni nəʊz/"], ["soon", "很快；马上", "/suːn/"], ["fever", "发烧；发热", "/ˈfiːvə(r)/"], ["cough", "咳嗽", "/kɒf/"], ["discuss", "讨论；商量", "/dɪˈskʌs/"], ["diet", "日常饮食", "/ˈdaɪət/"], ["stay up", "熬夜", "/steɪ ʌp/"], ["cry", "哭；哭泣", "/kraɪ/"], ["another", "另一；不同的（人或事物）", "/əˈnʌðə(r)/"], ["call", "（给……）打电话", "/kɔːl/"], ["email", "电子邮件", "/ˈiːmeɪl/"], ["unhappy", "不快乐的；难过的", "/ʌnˈhæpi/"], ["glass", "一杯（的量）；玻璃", "/ɡlɑːs/"], ["may", "也许；可能", "/meɪ/"], ["add", "补充说；增加", "/æd/"], ["video", "视频；录像", "/ˈvɪdiəʊ/"], ["better", "舒畅些的；（病势）好转的", "/ˈbetə(r)/"]], "phrases": [["have a runny nose", "流鼻涕"], ["have a bad cold", "重感冒"], ["head hurts", "头痛"], ["see a doctor", "看医生"], ["take sb. to hospital", "带某人去医院"], ["take care", "保重"], ["get well soon", "早日康复"], ["not feeling well", "不舒服"], ["feel cold", "感觉冷"], ["drink some water", "喝点水"], ["have a rest", "休息一下"], ["have a fever / a cough", "发烧 / 咳嗽"], ["in hospital", "住院"], ["prepare for", "准备"], ["eat healthy food", "吃健康的食物"], ["do exercise", "做运动"], ["take care of your eyes and teeth", "爱护你的眼睛和牙齿"], ["drink enough water", "喝足够的水"], ["healthy diet", "健康饮食"], ["jump rope", "跳绳"], ["play ball games", "进行球类运动"], ["feel down", "情绪低落"], ["move to another city", "搬到另一个城市"], ["make video calls", "打视频电话"], ["join after-school clubs", "参加课后社团"], ["make new friends", "交新朋友"], ["feel better", "感觉好点了"], ["take a deep breath", "深呼吸"]], "patterns": [["How do you feel?", "你感觉怎么样？"], ["I feel ill. My head hurts and I have a runny nose.", "我感觉不舒服。我头疼，还流鼻涕。"], ["What's the matter? / What's wrong?", "怎么了？"], ["I have a bad cold.", "我得了重感冒。"], ["Maybe you should see a doctor.", "也许你应该去看医生。"], ["My mum is going to take me to hospital this afternoon.", "我妈妈今天下午要带我去医院。"], ["We need to eat healthy food. We should exercise too.", "我们需要吃健康的食物，也应该锻炼。"], ["Health is having a good body and feeling happy.", "健康就是有好身体，并且感到快乐。"]], "trans": [["Hello?", "喂？"], ["Hi, Mike. It's Binbin. I'm going to the science museum tomorrow. Are you coming?", "嗨，迈克。我是斌斌。我明天要去科学博物馆。你来吗？"], ["I'm afraid not, Binbin. I have a bad cold.", "恐怕不行，斌斌。我得了重感冒。"], ["Oh dear! How do you feel?", "哦天哪！你感觉怎么样？"], ["I feel ill. My head hurts and I have a runny nose.", "我感觉不舒服。我头疼，还流鼻涕。"], ["I'm sorry to hear that. Maybe you should see a doctor.", "听到这个我很难过。也许你应该去看医生。"], ["I know. My mum is going to take me to hospital this afternoon.", "我知道。我妈妈今天下午要带我去医院。"], ["That's good. Take care and get well soon!", "那就好。保重，早日康复！"], ["Thanks.", "谢谢。"], ["How do you feel now?", "你现在感觉怎么样？"], ["I'm not feeling well. I feel cold and I have a runny nose.", "我感觉不舒服。我觉得冷，还流鼻涕。"], ["You should drink some water and have a rest.", "你应该喝点水，休息一下。"], ["Class, now we're going to discuss health. First, what is health?", "同学们，我们现在来讨论健康。首先，什么是健康？"], ["Health is having a good body and feeling happy.", "健康就是有好身体，并且感到快乐。"], ["Good, Chen Jie. So, how can we live a healthy life?", "很好，陈杰。那么，我们怎样才能过健康的生活？"], ["We need to eat healthy food. We should exercise too.", "我们需要吃健康的食物。我们也应该锻炼。"], ["That's right. What do you think, Binbin?", "说得对。你怎么看，斌斌？"], ["I think our family and friends are also important for a healthy life.", "我认为家人和朋友对健康的生活也很重要。"], ["Yes, it's always good to talk to our family and friends.", "是的，和家人朋友聊天总是好的。"], ["Good job, everyone!", "大家做得好！"], ["What's the matter?", "怎么了？"], ["I have a bad cold. My head hurts and I have a runny nose.", "我得了重感冒。我头疼，还流鼻涕。"], ["Mike has a bad cold. His head hurts and he has a runny nose.", "迈克得了重感冒。他头疼，还流鼻涕。"], ["He has a fever.", "他发烧了。"], ["She has a cough.", "她咳嗽。"], ["Have a healthy diet.", "保持健康的饮食。"], ["Don't stay up late.", "不要熬夜。"], ["Exercise often.", "经常锻炼。"], ["Think about happy things.", "想开心的事情。"], ["Join clubs and teams.", "加入俱乐部和团队。"], ["Have fun with your friends and family.", "和朋友家人一起开心。"], ["How can you live a healthy life? What is your plan?", "你怎样才能过健康的生活？你的计划是什么？"], ["I can exercise often. Jump rope or play ball games every day. And I should ...", "我可以经常锻炼。每天跳绳或打球。我还应该……"], ["Liu Jia was crying. So Miss White asked her, \"What's the matter, Liu Jia? You look sad.\"", "刘佳在哭。于是怀特老师问她：“怎么了，刘佳？你看起来很伤心。”"], ["Liu Jia answered, \"I'm feeling down. My good friend Lucy moved to another city.\"", "刘佳回答：“我心情很低落。我的好朋友露西搬到了另一个城市。”"], ["Miss White listened carefully and told Liu Jia, \"Think about happy things. Call your friend or send her some emails.\"", "怀特老师认真听了，告诉刘佳：“想开心的事情。给你的朋友打电话或给她发邮件。”"], ["\"I tried that, but I still feel unhappy,\" said Liu Jia.", "“我试过了，但我还是不开心，”刘佳说。"], ["Miss White gave her a glass of water. \"Maybe you can do some exercise. Exercise may cheer you up!\"", "怀特老师给了她一杯水。“也许你可以做点运动。运动可能会让你开心起来！”"], ["\"Join some after-school clubs and make new friends! You can talk and have fun with them,\" added Miss White.", "“参加一些课后社团，交新朋友！你可以和他们聊天、玩得开心，”怀特老师补充道。"], ["\"I will try. Thank you, Miss White,\" said Liu Jia.", "“我会试试的。谢谢你，怀特老师，”刘佳说。"], ["I often make video calls with my friend now.", "我现在经常和我的朋友打视频电话。"], ["I also joined a ping-pong club and made some new friends. I feel much better. Thank you so much!", "我还加入了乒乓球俱乐部，交了一些新朋友。我感觉好多了。非常感谢！"], ["John has a fever, a cough and a runny nose. He should see a doctor.", "约翰发烧、咳嗽、流鼻涕。他应该去看医生。"], ["Binbin ate too much cake. He should exercise.", "斌斌吃了太多蛋糕。他应该锻炼。"], ["Sarah's mum is tired. She shouldn't stay up late.", "萨拉的妈妈累了。她不应该熬夜。"], ["Amy feels sad. She should think about happy things and join some clubs.", "埃米感到难过。她应该想开心的事，加入一些社团。"], ["We need to eat healthy food and drink enough water.", "我们需要吃健康的食物，喝足够的水。"], ["It's OK to feel sad. We can talk to our friends.", "感到难过是正常的。我们可以和朋友聊聊。"], ["It's always good to talk to our family.", "和家人聊聊总是好的。"], ["My name is Right Hand. This is my twin brother, Left Hand.", "我叫右手。这是我的双胞胎兄弟，左手。"], ["One day, our master didn't wash us and ate his food. He felt ill the next day.", "有一天，主人没洗我们（手）就吃东西了。第二天他生病了。"], ["Now he washes us before every meal.", "现在他每餐前都洗我们。"], ["On another day, our master had a bad cold. He had a runny nose and a cough.", "另一天，主人得了重感冒。他流鼻涕、咳嗽。"], ["We wiped his nose and covered his mouth with a tissue. We're important for his physical health.", "我们给他擦鼻涕，用纸巾捂住他的嘴。我们对他的身体健康很重要。"], ["We're also important for his mental and social health.", "我们对他的心理和社交健康也很重要。"], ["One day, our master felt unhappy. But we helped him make handicrafts. He felt happy again.", "有一天，主人不开心。但我们帮他做手工艺品。他又开心了。"], ["Our master also cooked food for his parents and sister. They thanked him and said, \"You have really great hands!\"", "主人还给他的父母和妹妹做饭。他们感谢他，说：“你有一双很棒的手！”"], ["We're important for our master and his friends. He uses us to give them a high five.", "我们对主人和他的朋友们很重要。他用我们和他们击掌。"], ["We really are helping hands!", "我们真的是帮手！"]], "verbs": [["be (am, is, are)", "was, were"], ["make", "made"], ["say", "said"], ["eat", "ate"], ["feel", "felt"], ["give", "gave"], ["tell", "told"], ["have (has)", "had"], ["", ""]], "grammar": [["身体感受", "一般现在时：第三人称单数作主语时，注意动词变化。", "My head ___.", "hurts", ["hurt", "hurting"], "my head 是单数，动词用 hurts。"], ["给出建议", "should / shouldn’t + 动词原形。", "You should ___ a doctor.", "see", ["saw", "seeing"], "should 后用原形 see。"], ["即将做的事", "am / is / are going to + 动词原形，表达计划。", "My mum is going to ___ me to hospital.", "take", ["takes", "took"], "going to 后用动词原形 take。"]], "passages": [{"title": "电话问候：生病与就医", "items": [["Hello?", "喂？"], ["Hi, Mike. It's Binbin. I'm going to the science museum tomorrow. Are you coming?", "嗨，迈克。我是斌斌。我明天要去科学博物馆。你来吗？"], ["I'm afraid not, Binbin. I have a bad cold.", "恐怕不行，斌斌。我得了重感冒。"], ["Oh dear! How do you feel?", "哦天哪！你感觉怎么样？"], ["I feel ill. My head hurts and I have a runny nose.", "我感觉不舒服。我头疼，还流鼻涕。"], ["I'm sorry to hear that. Maybe you should see a doctor.", "听到这个我很难过。也许你应该去看医生。"], ["I know. My mum is going to take me to hospital this afternoon.", "我知道。我妈妈今天下午要带我去医院。"], ["That's good. Take care and get well soon!", "那就好。保重，早日康复！"], ["Thanks.", "谢谢。"]]}, {"title": "身体感受与建议", "items": [["How do you feel now?", "你现在感觉怎么样？"], ["I'm not feeling well. I feel cold and I have a runny nose.", "我感觉不舒服。我觉得冷，还流鼻涕。"], ["You should drink some water and have a rest.", "你应该喝点水，休息一下。"]]}, {"title": "课堂讨论：什么是健康", "items": [["Class, now we're going to discuss health. First, what is health?", "同学们，我们现在来讨论健康。首先，什么是健康？"], ["Health is having a good body and feeling happy.", "健康就是有好身体，并且感到快乐。"], ["Good, Chen Jie. So, how can we live a healthy life?", "很好，陈杰。那么，我们怎样才能过健康的生活？"], ["We need to eat healthy food. We should exercise too.", "我们需要吃健康的食物。我们也应该锻炼。"], ["That's right. What do you think, Binbin?", "说得对。你怎么看，斌斌？"], ["I think our family and friends are also important for a healthy life.", "我认为家人和朋友对健康的生活也很重要。"], ["Yes, it's always good to talk to our family and friends.", "是的，和家人朋友聊天总是好的。"], ["Good job, everyone!", "大家做得好！"]]}, {"title": "Let's learn · 病症表达（p.29 / p.31）", "items": [["What's the matter?", "怎么了？"], ["I have a bad cold. My head hurts and I have a runny nose.", "我得了重感冒。我头疼，还流鼻涕。"], ["Mike has a bad cold. His head hurts and he has a runny nose.", "迈克得了重感冒。他头疼，还流鼻涕。"], ["He has a fever.", "他发烧了。"], ["She has a cough.", "她咳嗽。"], ["Have a healthy diet.", "保持健康的饮食。"], ["Don't stay up late.", "不要熬夜。"], ["Exercise often.", "经常锻炼。"], ["Think about happy things.", "想开心的事情。"], ["Join clubs and teams.", "加入俱乐部和团队。"], ["Have fun with your friends and family.", "和朋友家人一起开心。"], ["How can you live a healthy life? What is your plan?", "你怎样才能过健康的生活？你的计划是什么？"], ["I can exercise often. Jump rope or play ball games every day. And I should ...", "我可以经常锻炼。每天跳绳或打球。我还应该……"]]}, {"title": "Read and write · 刘佳的故事（p.32）", "items": [["Liu Jia was crying. So Miss White asked her, \"What's the matter, Liu Jia? You look sad.\"", "刘佳在哭。于是怀特老师问她：“怎么了，刘佳？你看起来很伤心。”"], ["Liu Jia answered, \"I'm feeling down. My good friend Lucy moved to another city.\"", "刘佳回答：“我心情很低落。我的好朋友露西搬到了另一个城市。”"], ["Miss White listened carefully and told Liu Jia, \"Think about happy things. Call your friend or send her some emails.\"", "怀特老师认真听了，告诉刘佳：“想开心的事情。给你的朋友打电话或给她发邮件。”"], ["\"I tried that, but I still feel unhappy,\" said Liu Jia.", "“我试过了，但我还是不开心，”刘佳说。"], ["Miss White gave her a glass of water. \"Maybe you can do some exercise. Exercise may cheer you up!\"", "怀特老师给了她一杯水。“也许你可以做点运动。运动可能会让你开心起来！”"], ["\"Join some after-school clubs and make new friends! You can talk and have fun with them,\" added Miss White.", "“参加一些课后社团，交新朋友！你可以和他们聊天、玩得开心，”怀特老师补充道。"], ["\"I will try. Thank you, Miss White,\" said Liu Jia.", "“我会试试的。谢谢你，怀特老师，”刘佳说。"], ["I often make video calls with my friend now.", "我现在经常和我的朋友打视频电话。"], ["I also joined a ping-pong club and made some new friends. I feel much better. Thank you so much!", "我还加入了乒乓球俱乐部，交了一些新朋友。我感觉好多了。非常感谢！"]]}, {"title": "Project · 健康小册子（p.34）", "items": [["John has a fever, a cough and a runny nose. He should see a doctor.", "约翰发烧、咳嗽、流鼻涕。他应该去看医生。"], ["Binbin ate too much cake. He should exercise.", "斌斌吃了太多蛋糕。他应该锻炼。"], ["Sarah's mum is tired. She shouldn't stay up late.", "萨拉的妈妈累了。她不应该熬夜。"], ["Amy feels sad. She should think about happy things and join some clubs.", "埃米感到难过。她应该想开心的事，加入一些社团。"], ["We need to eat healthy food and drink enough water.", "我们需要吃健康的食物，喝足够的水。"], ["It's OK to feel sad. We can talk to our friends.", "感到难过是正常的。我们可以和朋友聊聊。"], ["It's always good to talk to our family.", "和家人聊聊总是好的。"]]}, {"title": "Reading time · 我们是帮手（p.36-37）", "items": [["My name is Right Hand. This is my twin brother, Left Hand.", "我叫右手。这是我的双胞胎兄弟，左手。"], ["One day, our master didn't wash us and ate his food. He felt ill the next day.", "有一天，主人没洗我们（手）就吃东西了。第二天他生病了。"], ["Now he washes us before every meal.", "现在他每餐前都洗我们。"], ["On another day, our master had a bad cold. He had a runny nose and a cough.", "另一天，主人得了重感冒。他流鼻涕、咳嗽。"], ["We wiped his nose and covered his mouth with a tissue. We're important for his physical health.", "我们给他擦鼻涕，用纸巾捂住他的嘴。我们对他的身体健康很重要。"], ["We're also important for his mental and social health.", "我们对他的心理和社交健康也很重要。"], ["One day, our master felt unhappy. But we helped him make handicrafts. He felt happy again.", "有一天，主人不开心。但我们帮他做手工艺品。他又开心了。"], ["Our master also cooked food for his parents and sister. They thanked him and said, \"You have really great hands!\"", "主人还给他的父母和妹妹做饭。他们感谢他，说：“你有一双很棒的手！”"], ["We're important for our master and his friends. He uses us to give them a high five.", "我们对主人和他的朋友们很重要。他用我们和他们击掌。"], ["We really are helping hands!", "我们真的是帮手！"]]}]}, {"name": "Managing money well", "cn": "理财计划", "words": [["money", "钱", "/ˈmʌni/"], ["pocket money", "零花钱", "/ˈpɒkɪt ˈmʌni/"], ["schoolbag", "书包", "/ˈskuːlbæɡ/"], ["goods", "商品", "/ɡʊdz/"], ["drink", "饮料", "/drɪŋk/"], ["service", "服务", "/ˈsɜːvɪs/"], ["haircut", "理发；发型", "/ˈheəkʌt/"], ["microscope", "显微镜", "/ˈmaɪkrəskəʊp/"], ["lucky", "幸运的", "/ˈlʌki/"], ["save up", "攒钱", "/seɪv ʌp/"], ["sale", "特价销售；出售", "/seɪl/"], ["ticket", "票", "/ˈtɪkɪt/"], ["manage", "管理", "/ˈmænɪdʒ/"], ["difficult", "困难的", "/ˈdɪfɪkəlt/"], ["sell", "出售；售卖", "/sel/"], ["jar", "罐子", "/dʒɑː(r)/"], ["half", "一半", "/hɑːf/"], ["for example", "例如", "/fɔːr ɪɡˈzɑːmpl/"]], "phrases": [["piggy bank", "存钱罐"], ["count your pocket money", "数你的零花钱"], ["buy goods", "购买商品"], ["pay for services", "支付服务费用"], ["home deliveries", "送货上门"], ["have a haircut", "理发"], ["go swimming / go to the cinema", "去游泳 / 去看电影"], ["go to a dance class", "去上舞蹈课"], ["see a doctor", "看医生"], ["spending plan", "消费计划"], ["things for now", "当下需要的东西"], ["things for later", "以后需要的东西"], ["a pair of sunglasses", "一副太阳镜"], ["a book about space", "一本关于太空的书"], ["wait for a sale", "等促销 / 打折"], ["be careful with money", "谨慎用钱"], ["use our money wisely", "明智地使用我们的钱"], ["manage money well", "很好地管理金钱"], ["save up for big things", "为大件物品存钱"], ["a robot show ticket", "机器人展门票"], ["exchange goods or services", "交换商品或服务"], ["metal coins", "金属货币"], ["shell money / paper money", "贝壳货币 / 纸币"], ["pay in cash", "用现金支付"], ["use my mobile phone", "用我的手机（支付）"], ["so quick and easy", "又快又方便"], ["a long time ago", "很久以前"], ["sell waste and old things", "卖废品和旧东西"]], "patterns": [["How are you going to spend it?", "你打算怎么花（这些钱）？"], ["I'm going to buy a schoolbag.", "我打算买一个书包。"], ["What are you going to do this weekend?", "这周末你打算做什么？"], ["I'm going to have a haircut.", "我打算去理发。"], ["I also want to buy a microscope.", "我还想买一台显微镜。"], ["I still need to save more.", "我仍然需要多存点钱。"], ["Maybe we can wait for a sale!", "也许我们可以等打折！"], ["People use money to buy goods and pay for services.", "人们用钱购买商品，支付服务费用。"]], "trans": [["Are you counting your pocket money, Matt?", "马特，你在数零花钱吗？"], ["Yes. I have three hundred and fifty-seven yuan.", "是的。我有三百五十七元。"], ["Wow, that's a lot. How are you going to spend it?", "哇，真不少。你打算怎么花？"], ["I'm going to buy a schoolbag.", "我打算买一个书包。"], ["Yes, you need a new one.", "是的，你需要一个新书包。"], ["I also want to buy some books.", "我还想买一些书。"], ["Nice. Maybe you can buy some animal books. They're interesting.", "不错。也许你可以买一些动物书。它们很有趣。"], ["Great idea! I like animals. Should I also buy some ice cream?", "好主意！我喜欢动物。我还要买点冰淇淋吗？"], ["Sure, but don't eat too much.", "可以，但别吃太多。"], ["You're right. I won't.", "你说得对。我不会的。"], ["How much pocket money do you have?", "你有多少零花钱？"], ["I have one hundred and forty-six yuan.", "我有一百四十六元。"], ["What else are you going to buy?", "你还打算买什么？"], ["A lot. But first I'm going to buy a pair of sunglasses for Grandpa.", "很多东西。但首先我打算给爷爷买一副太阳镜。"], ["Why?", "为什么？"], ["Because he lost his old pair last weekend.", "因为他上周末把旧的弄丢了。"], ["That's so nice of you!", "你真好！"], ["I also want to buy a microscope.", "我还想买一台显微镜。"], ["Good idea! But microscopes are expensive.", "好主意！但显微镜很贵。"], ["I also have some lucky money from the Spring Festival, but I still need to save more.", "我还有一些春节压岁钱，但我还需要多存点。"], ["Maybe we can wait for a sale!", "也许我们可以等打折！"], ["People use money to do different things.", "人们用钱做不同的事。"], ["We use money to buy goods. We buy food and drink.", "我们用钱买商品。我们买食物和饮料。"], ["We buy clothes and school things.", "我们买衣服和学习用品。"], ["We use money to pay for services. We need different services: haircuts, home deliveries, ...", "我们用钱支付服务费用。我们需要不同的服务：理发、送货上门……"], ["How are you going to spend your pocket money? — I'm going to have a haircut, ...", "你打算怎么花零花钱？——我打算去理发……"], ["Where does our money go?", "我们的钱花到哪里去了？"], ["Mike is going to save up for a computer.", "迈克打算攒钱买一台电脑。"], ["He wants to be careful with money, so he will write a spending plan.", "他想谨慎用钱，所以他会写一个消费计划。"], ["Liu Jia wants to buy a new schoolbag. But she is going to wait for a sale.", "刘佳想买一个新书包。但她打算等打折。"], ["Binbin is going to buy a nice gift for Grandpa. He also wants to buy a robot show ticket.", "斌斌打算给爷爷买一份漂亮的礼物。他还想买机器人展的门票。"], ["How can we use our money wisely?", "我们怎样才能明智地用钱？"], ["We can write a spending plan. We can wait for a sale.", "我们可以写消费计划。我们可以等打折。"], ["I have 152 yuan. I put 52 yuan into my piggy bank. Now I still have 100 yuan.", "我有152元。我把52元放进存钱罐。现在我还有100元。"], ["How are you going to spend it in the next month?", "下个月你打算怎么花？"], ["I'm going to buy ... I also need some ...", "我打算买……我还需要一些……"], ["This is my spending plan for the next month. I'm going to ...", "这是我下个月的消费计划。我打算……"], ["I like your plan.", "我喜欢你的计划。"], ["Your plan is nice. But maybe you can ...", "你的计划很好。但也许你可以……"], ["A long time ago, people exchanged goods or services. Sometimes it was difficult to get the things they wanted.", "很久以前，人们交换商品或服务。有时很难得到他们想要的东西。"], ["Later, people used different forms of money. But what did the money look like? Look! There is shell money, knife money, copper coins, ...", "后来，人们使用不同形式的货币。但货币长什么样？看！有贝壳币、刀币、铜币……"], ["But metal coins were heavy to carry. So people used paper money.", "但金属硬币携带很重。所以人们使用纸币。"], ["We still use paper money today. We also have bankbooks and cards.", "今天我们仍然使用纸币。我们还有存折和银行卡。"], ["How are you going to pay for your haircuts?", "你打算怎么付理发钱？"], ["I'm going to pay in cash.", "我打算用现金支付。"], ["I'm going to use my mobile phone.", "我打算用手机支付。"], ["Now we can use our mobile phones to pay. It is so quick and easy!", "现在我们能用手机支付。又快又方便！"], ["How will we buy things in future? What are your ideas?", "将来我们怎么买东西？你有什么想法？"]], "verbs": [["be (am, is, are)", "was, were"], ["put", "put"], ["do", "did"], ["win", "won"], ["", ""]], "grammar": [["花钱计划", "be going to + 动词原形：打算做某事。", "I am going to ___ a schoolbag.", "buy", ["bought", "buying"], "打算买：am going to buy。"], ["表达愿望", "want to + 动词原形：想要做某事。", "I want ___ a microscope.", "to buy", ["buy", "bought"], "want to buy 表达想买。"], ["表达需要", "need to + 动词原形：需要做某事。", "I need to ___ more money.", "save", ["saved", "saving"], "need to save 表达需要存钱。"]], "passages": [{"title": "零花钱的使用计划", "items": [["Are you counting your pocket money, Matt?", "马特，你在数零花钱吗？"], ["Yes. I have three hundred and fifty-seven yuan.", "是的。我有三百五十七元。"], ["Wow, that's a lot. How are you going to spend it?", "哇，真不少。你打算怎么花？"], ["I'm going to buy a schoolbag.", "我打算买一个书包。"], ["Yes, you need a new one.", "是的，你需要一个新书包。"], ["I also want to buy some books.", "我还想买一些书。"], ["Nice. Maybe you can buy some animal books. They're interesting.", "不错。也许你可以买一些动物书。它们很有趣。"], ["Great idea! I like animals. Should I also buy some ice cream?", "好主意！我喜欢动物。我还要买点冰淇淋吗？"], ["Sure, but don't eat too much.", "可以，但别吃太多。"], ["You're right. I won't.", "你说得对。我不会的。"]]}, {"title": "交流零花钱数额", "items": [["How much pocket money do you have?", "你有多少零花钱？"], ["I have one hundred and forty-six yuan.", "我有一百四十六元。"]]}, {"title": "购物愿望与储蓄", "items": [["What else are you going to buy?", "你还打算买什么？"], ["A lot. But first I'm going to buy a pair "title": "Reading time · 货币的过去、现在与未来（p.48-49）", "items": [["A long time ago, people exchanged goods or services. Sometimes it was difficult to get the things they wanted.", "很久以前，人们交换商品或服务。有时很难得到他们想要的东西。"], ["Later, people used different forms of money. But what did the money look like? Look! There is shell money, knife money, copper coins, ...", "后来，人们使用不同形式的货币。但货币长什么样？看！有贝壳币、刀币、铜币……"], ["But metal coins were heavy to carry. So people used paper money.", "但金属硬币携带很重。所以人们使用纸币。"], ["We still use paper money today. We also have bankbooks and cards.", "今天我们仍然使用纸币。我们还有存折和银行卡。"], ["How are you going to pay for your haircuts?", "你打算怎么付理发钱？"], ["I'm going to pay in cash.", "我打算用现金支付。"], ["I'm going to use my mobile phone.", "我打算用手机支付。"], ["Now we can use our mobile phones to pay. It is so quick and easy!", "现在我们能用手机支付。又快又方便！"], ["How will we buy things in future? What are your ideas?", "将来我们怎么买东西？你有什么想法？"]]}]}, {"name": "Exploring space", "cn": "探索太空", "words": [["planet", "行星", "/ˈplænɪt/"], ["earth", "地球", "/ɜːθ/"], ["sky", "天；天空", "/skaɪ/"], ["daytime", "白天", "/ˈdeɪtaɪm/"], ["cloud", "云", "/klaʊd/"], ["moon", "月球；月亮；卫星", "/muːn/"], ["star", "恒星；星", "/stɑː(r)/"], ["space", "太空；空间", "/speɪs/"], ["outer space", "外层空间；外太空", "/ˈaʊtə(r) speɪs/"], ["ocean", "大海；海洋", "/ˈəʊʃn/"], ["marble", "（玻璃）弹子", "/ˈmɑːbl/"], ["satellite", "人造卫星", "/ˈsætəlaɪt/"], ["soil", "土壤", "/sɔɪl/"], ["alien", "外星生物", "/ˈeɪliən/"], ["sunrise", "日出", "/ˈsʌnraɪz/"], ["rover", "探测器", "/ˈrəʊvə(r)/"], ["into", "朝；进入", "/ˈɪntə/"], ["telescope", "望远镜", "/ˈtelɪskəʊp/"], ["astronaut", "宇航员；航天员", "/ˈæstrənɔːt/"], ["spaceship", "宇宙飞船", "/ˈspeɪsʃɪp/"], ["month", "月；月份", "/mʌnθ/"], ["taikonaut", "中国航天员", "/ˈtaɪkənɔːt/"], ["cloth", "（一块）布；织物", "/klɒθ/"], ["toothpaste", "牙膏", "/ˈtuːθpeɪst/"], ["question", "问题", "/ˈkwestʃən/"], ["sunset", "日落", "/ˈsʌnset/"], ["time", "次；回", "/taɪm/"], ["Mars", "火星", "/mɑːz/"]], "phrases": [["explore space", "探索太空"], ["in the universe", "在宇宙中"], ["talk about", "谈论"], ["space station", "空间站"], ["travel around", "绕……运行"], ["put a rover on Mars", "在火星上放置探测器"], ["look into space with telescopes", "用望远镜观察太空"], ["get up", "起床"], ["wash one's face", "洗脸"], ["brush one's teeth", "刷牙"], ["use a wet cloth", "用湿毛巾"], ["grow vegetables and rice", "种植蔬菜和水稻"], ["give classes to children", "给孩子们上课"], ["answer questions about space", "回答关于太空的问题"], ["stay healthy", "保持健康"], ["do exercise", "做运动"], ["feel the warmth of the Sun", "感受太阳的温暖"], ["see the sunrise and sunset 16 times a day", "一天看16次日出和日落"]], "patterns": [["What can you see in the sky?", "你能在天空中看到什么？"], ["We can see the Sun and the clouds.", "我们能看到太阳和云。"], ["At night, we can see the Moon and the stars.", "在晚上，我们能看到月亮和星星。"], ["Is there any water on Mars?", "火星上有水吗？"], ["Yes, there is. There is soil too.", "是的，有。那里还有土壤。"], ["Are there any aliens?", "那儿有外星人吗？"], ["I don't think so. They say there aren't any living things.", "我不这样认为。据说那里没有生物。"], ["It looks like a big blue marble.", "它看起来像一个巨大的蓝色玻璃弹珠。"], ["How can we explore space?", "我们怎样探索太空？"], ["We can look into space with telescopes.", "我们可以用望远镜观察太空。"]], "trans": [["Hi, children. Let's talk about our planet Earth today. What can you see in the sky?", "嗨，孩子们。今天我们来谈谈我们的星球地球。你能在天空中看到什么？"], ["The sky is often blue in the daytime. We can see the Sun and the clouds. We can also see birds and planes.", "白天天空通常是蓝色的。我们能看到太阳和云。我们也能看到鸟和飞机。"], ["At night, we can see the Moon and the stars.", "晚上，我们能看到月亮和星星。"], ["Very good. But what can we see from outer space? Let's look at some photos from a space station.", "非常好。但我们从外太空能看到什么？让我们看看空间站拍的一些照片。"], ["Wow! We can see mountains, oceans and clouds. How wonderful!", "哇！我们能看到山脉、海洋和云朵。太棒了！"], ["There are large oceans on Earth. It looks like a big blue marble.", "地球上有大片海洋。它看起来像一颗蓝色的大弹珠。"], ["Right. Earth also has some beautiful names. For example, the Blue Planet and Mother Earth.", "对。地球还有一些美丽的名字。比如“蓝色星球”和“地球母亲”。"], ["I like those names. I want to know more about our Mother Earth!", "我喜欢这些名字。我想了解更多关于我们地球母亲的事！"], ["Hey, Chen Jie. What are you reading about? — Mars.", "嘿，陈杰。你在读什么？——火星。"], ["Mars? What does it say?", "火星？上面说了什么？"], ["It talks about things on Mars.", "它讲的是火星上的事物。"], ["Wow! Is there any water on Mars?", "哇！火星上有水吗？"], ["Yes, there is. There is soil too.", "是的，有。那里还有土壤。"], ["Oh! Are there any aliens?", "哦！有外星人吗？"], ["I don't think so. They say there aren't any living things.", "我觉得没有。据说那里没有生物。"], ["I see.", "我明白了。"], ["Look! This is the sunrise on Mars.", "看！这是火星上的日出。"], ["How beautiful! I really want to travel to Mars.", "太美了！我真想去火星旅行。"], ["Maybe you can go one day. China already put a rover on Mars.", "也许有一天你能去。中国已经在火星上放置了探测器。"], ["We learn more about the \"red planet\" every year.", "我们每年对这颗“红色星球”了解得更多。"], ["Hi, I'm Earth. I'm a planet.", "嗨，我是地球。我是一颗行星。"], ["I travel around the Sun.", "我绕着太阳转。"], ["Satellites travel around me.", "卫星绕着我转。"], ["The Moon is my neighbour. It travels around me too.", "月球是我的邻居。它也绕着我转。"], ["People can often see the Moon and the stars at night.", "人们晚上经常能看到月亮和星星。"], ["At night, we can see the Moon and the stars from Earth. We can see some planets too.", "晚上，我们能从地球看到月亮和星星。我们也能看到一些行星。"], ["In the daytime, we can see ...", "在白天，我们可以看到……"], ["We explore space in different ways.", "我们用不同的方式探索太空。"], ["We can look into space with telescopes.", "我们可以用望远镜观察太空。"], ["Astronauts go into space. They use a spaceship to fly there.", "宇航员进入太空。他们乘宇宙飞船飞往那里。"], ["Some astronauts live for months on a space station.", "有些宇航员在空间站生活好几个月。"], ["How can we explore space? — There are many ways. We can ...", "我们怎样探索太空？——有很多方式。我们可以……"], ["What do people use to explore space? — We use telescopes, ...", "人们用什么探索太空？——我们用望远镜……"], ["What is man-made in the picture? — The space station, ...", "图片中哪些是人造的？——空间站……"], ["Chinese astronauts are called taikonauts. Their life in space is special.", "中国航天员被称为 taikonauts。他们在太空的生活很特别。"], ["The taikonauts get up early in the morning. But getting ready is different.", "中国航天员早上起得很早。但准备工作和在地球上不一样。"], ["They can't use water to wash their faces. So taikonauts have to use a wet cloth.", "他们不能用水洗脸。所以中国航天员必须用湿毛巾擦。"], ["They brush their teeth with a special toothpaste and have to \"eat\" it!", "他们用一种特殊的牙膏刷牙，还得把它“吃掉”！"], ["Each day the taikonauts are very busy. They do a lot of work.", "中国航天员每天都很忙。他们做很多工作。"], ["For example, they grow vegetables and rice.", "比如，他们种植蔬菜和水稻。"], ["Sometimes, they also give classes to children and answer questions about space.", "有时他们还给孩子们上课，回答关于太空的问题。"], ["It is hard work. The taikonauts must stay healthy. Every afternoon they do exercise to keep healthy and strong.", "这是辛苦的工作。中国航天员必须保持健康。每天下午他们做运动来保持健康强壮。"], ["But their job is also very interesting. They can see the sunrise and sunset 16 times a day.", "但他们的工作也很有趣。他们一天能看到16次日出和日落。"], ["The view is amazing! There is no other job like this one.", "景色太美了！没有别的工作像这样。"], ["Is the Sun a star?", "太阳是恒星吗？"], ["Can a spaceship fly to the Sun?", "宇宙飞船能飞到太阳上吗？"], ["Can we feel the warmth of the Sun in the winter?", "冬天我们能感受到太阳的温暖吗？"], ["Are there any planets around the Sun?", "太阳周围有行星吗？"], ["Facts about the Sun: It is a star. There isn't any life on it. It gives us light and keeps us warm.", "关于太阳的事实：它是一颗恒星。上面没有生命。它给我们光，让我们保持温暖。"], ["Facts about Earth: It is a planet. There are oceans, mountains and forests. There are satellites around Earth.", "关于地球的事实：它是一颗行星。有海洋、山脉和森林。地球周围有卫星。"], ["Facts about astronauts: An astronaut studies space, stars and planets. They work in a space station. They go there by spaceship.", "关于宇航员的事实：宇航员研究太空、恒星和行星。他们在空间站工作。他们乘宇宙飞船去那里。"], ["What facts do you know about the Sun? — The Sun gives us light and keeps us warm.", "关于太阳你知道哪些事实？——太阳给我们光，让我们保持温暖。"], ["Is there any life on the Sun? — No, there isn't.", "太阳上有生命吗？——不，没有。"], ["The Sun is very big and hot. There isn't any life on it. But it gives us light and keeps us warm.", "太阳非常大而且热。上面没有生命。但它给我们光，让我们保持温暖。"], ["Earth goes around the Sun. So we have four seasons. Earth spins, so we have day and night.", "地球绕着太阳转。所以我们有四季。地球自转，所以我们有白天和黑夜。"], ["The closest planet to the Sun is not the hottest.", "离太阳最近的行星不是最热的。"], ["The hottest planet is Venus. It has a temperature of about 467℃.", "最热的行星是金星。它的温度大约467℃。"], ["Jupiter's storm may be more than 300 years old.", "木星的风暴可能超过300岁了。"], ["The name of the big storm on Jupiter is the Great Red Spot. It is wider than Earth.", "木星上大风暴的名字叫大红斑。它比地球还宽。"], ["Neptune has the fastest wind in the solar system. Neptune's winds can reach over 2,000 kilometres per hour.", "海王星拥有太阳系中最快的风。海王星的风速每小时能超过2000千米。"], ["Is there any water on these planets? — Very little. So there are no fish out there.", "这些行星上有水吗？——非常少。所以那里没有鱼。"], ["Saturn has over ten moons. It may have more! Scientists are still looking for them.", "土星有十多个卫星。可能更多！科学家还在寻找。"], ["Footprints on the Moon could stay there for a very long time. They could be there for thousands of years!", "月球上的脚印能保留很长时间。它们可能在那里存在数千年！"], ["There are thousands of pieces of space junk floating around Earth.", "有成千上万片太空垃圾在地球周围漂浮。"], ["Space junk is man-made objects left in space. And the number is growing!", "太空垃圾是留在太空的人造物体。而且数量还在增长！"], ["What other facts do you know?", "你还知道其他事实吗？"]], "verbs": [["be (am, is, are)", "was, were"], ["make", "made"], ["put", "put"], ["let", "let"], ["", ""]], "grammar": [["There is / are", "单数或不可数名词用 is；复数名词用 are。", "There ___ large oceans on Earth.", "are", ["is", "am"], "oceans 是复数，使用 are。"], ["There be 问句", "Is / Are there ...? 根据名词选择 is 或 are。", "___ there any water on Mars?", "Is", ["Are", "Do"], "water 是不可数名词，用 Is there。"], ["can 的用法", "can + 动词原形，表达能做什么。", "We can ___ stars at night.", "see", ["sees", "seeing"], "can 后面用动词原形。"]], "passages": [{"title": "从天空到地球", "items": [["Hi, children. Let's talk about our planet Earth today. What can you see in the sky?", "嗨，孩子们。今天我们来谈谈我们的星球地球。你能在天空中看到什么？"], ["The sky is often blue in the daytime. We can see the Sun and the clouds. We can also see birds and planes.", "白天天空通常是蓝色的。我们能看到太阳和云。我们也能看到鸟和飞机。"], ["At night, we can see the Moon and the stars.", "晚上，我们能看到月亮和星星。"], ["Very good. But what can we see from outer space? Let's look at some photos from a space station.", "非常好。但我们从外太空能看到什么？让我们看看空间站拍的一些照片。"], ["Wow! We can see mountains, oceans and clouds. How wonderful!", "哇！我们能看到山脉、海洋和云朵。太棒了！"], ["There are large oceans on Earth. It looks like a big blue marble.", "地球上有大片海洋。它看起来像一颗蓝色的大弹珠。"], ["Right. Earth also has some beautiful names. For example, the Blue Planet and Mother Earth.", "对。地球还有一些美丽的名字。比如“蓝色星球”和“地球母亲”。"], ["I like those names. I want to know more about our Mother Earth!", "我喜欢这些名字。我想了解更多关于我们地球母亲的事！"]]}, {"title": "阅读与讨论火星", "items": [["Hey, Chen Jie. What are you reading about? — Mars.", "嘿，陈杰。你在读什么？——火星。"], ["Mars? What does it say?", "火星？上面说了什么？"], ["It talks about things on Mars.", "它讲的是火星上的事物。"], ["Wow! Is there any water on Mars?", "哇！火星上有水吗？"], ["Yes, there is. There is soil too.", "是的，有。那里还有土壤。"], ["Oh! Are there any aliens?", "哦！有外星人吗？"], ["I don't think so. They say there aren't any living things.", "我觉得没有。据说那里没有生物。"], ["I see.", "我明白了。"], ["Look! This is the sunrise on Mars.", "看！这是火星上的日出。"], ["How beautiful! I really want to travel to Mars.", "太美了！我真想去火星旅行。"], ["Maybe you can go one day. China already put a rover on Mars.", "也许有一天你能去。中国已经在火星上放置了探测器。"], ["We learn more about the \"red planet\" every year.", "我们每年对这颗“红色星球”了解得更多。"]]}, {"title": "Let's learn · 地球与太空（p.53 / p.55）", "items": [["Hi, I'm Earth. I'm a planet.", "嗨，我是地球。我是一颗行星。"], ["I travel around the Sun.", "我绕着太阳转。"], ["Satellites travel around me.", "卫星绕着我转。"], ["The Moon is my neighbour. It travels around me too.", "月球是我的邻居。它也绕着我转。"], ["People can often see the Moon and the stars at night.", "人们晚上经常能看到月亮和星星。"], ["At night, we can see the Moon and the stars from Earth. We can see some planets too.", "晚上，我们能从地球看到月亮和星星。我们也能看到一些行星。"], ["In the daytime, we can see ...", "在白天，我们可以看到……"], ["We explore space in different ways.", "我们用不同的方式探索太空。"], ["We can look into space with telescopes.", "我们可以用望远镜观察太空。"], ["Astronauts go into space. They use a spaceship to fly there.", "宇航员进入太空。他们乘宇宙飞船飞往那里。"], ["Some astronauts live for months on a space station.", "有些宇航员在空间站生活好几个月。"], ["How can we explore space? — There are many ways. We can ...", "我们怎样探索太空？——有很多方式。我们可以……"], ["What do people use to explore space? — We use telescopes, ...", "人们用什么探索太空？——我们用望远镜……"], ["What is man-made in the picture? — The space station, ...", "图片中哪些是人造的？——空间站……"]]}, {"title": "Read and write · 航天员的一天（p.56）", "items": [["Chinese astronauts are called taikonauts. Their life in space is special.", "中国航天员被称为 taikonauts。他们在太空的生活很特别。"], ["The taikonauts get up early in the morning. But getting ready is different.", "中国航天员早上起得很早。但准备工作和在地球上不一样。"], ["They can't use water to wash their faces. So taikonauts have to use a wet cloth.", "他们不能用水洗脸。所以中国航天员必须用湿毛巾擦。"], ["They brush their teeth with a special toothpaste and have to \"eat\" it!", "他们用一种特殊的牙膏刷牙，还得把它“吃掉”！"], ["Each day the taikonauts are very busy. They do a lot of work.", "中国航天员每天都很忙。他们做很多工作。"], ["For example, they grow vegetables and rice.", "比如，他们种植蔬菜和水稻。"], ["Sometimes, they also give classes to children and answer questions about space.", "有时他们还给孩子们上课，回答关于太空的问题。"], ["It is hard work. The taikonauts must stay healthy. Every afternoon they do exercise to keep healthy and strong.", "这是辛苦的工作。中国航天员必须保持健康。每天下午他们做运动来保持健康强壮。"], ["But their job is also very interesting. They can see the sunrise and sunset 16 times a day.", "但他们的工作也很有趣。他们一天能看到16次日出和日落。"], ["The view is amazing! There is no other job like this one.", "景色太美了！没有别的工作像这样。"]]}, {"title": "Project · 地球太阳月球事实卡（p.58-59）", "items": [["Is the Sun a star?", "太阳是恒星吗？"], ["Can a spaceship fly to the Sun?", "宇宙飞船能飞到太阳上吗？"], ["Can we feel the warmth of the Sun in the winter?", "冬天我们能感受到太阳的温暖吗？"], ["Are there any planets around the Sun?", "太阳周围有行星吗？"], ["Facts about the Sun: It is a star. There isn't any life on it. It gives us light and keeps us warm.", "关于太阳的事实：它是一颗恒星。上面没有生命。它给我们光，让我们保持温暖。"], ["Facts about Earth: It is a planet. There are oceans, mountains and forests. There are satellites around Earth.", "关于地球的事实：它是一颗行星。有海洋、山脉和森林。地球周围有卫星。"], ["Facts about astronauts: An astronaut studies space, stars and planets. They work in a space station. They go there by spaceship.", "关于宇航员的事实：宇航员研究太空、恒星和行星。他们在空间站工作。他们乘宇宙飞船去那里。"], ["What facts do you know about the Sun? — The Sun gives us light and keeps us warm.", "关于太阳你知道哪些事实？——太阳给我们光，让我们保持温暖。"], ["Is there any life on the Sun? — No, there isn't.", "太阳上有生命吗？——不，没有。"], ["The Sun is very big and hot. There isn't any life on it. But it gives us light and keeps us warm.", "太阳非常大而且热。上面没有生命。但它给我们光，让我们保持温暖。"], ["Earth goes around the Sun. So we have four seasons. Earth spins, so we have day and night.", "地球绕着太阳转。所以我们有四季。地球自转，所以我们有白天和黑夜。"]]}, {"title": "Reading time · 太阳系趣事（p.60-61）", "items": [["The closest planet to the Sun is not the hottest.", "离太阳最近的行星不是最热的。"], ["The hottest planet is Venus. It has a temperature of about 467℃.", "最热的行星是金星。它的温度大约467℃。"], ["Jupiter's storm may be more than 300 years old.", "木星的风暴可能超过300岁了。"], ["The name of the big storm on Jupiter is the Great Red Spot. It is wider than Earth.", "木星上大风暴的名字叫大红斑。它比地球还宽。"], ["Neptune has the fastest wind in the solar system. Neptune's winds can reach over 2,000 kilometres per hour.", "海王星拥有太阳系中最快的风。海王星的风速每小时能超过2000千米。"], ["Is there any water on these planets? — Very little. So there are no fish out there.", "这些行星上有水吗？——非常少。所以那里没有鱼。"], ["Saturn has over ten moons. It may have more! Scientists are still looking for them.", "土星有十多个卫星。可能更多！科学家还在寻找。"], ["Footprints on the Moon could stay there for a very long time. They could be there for thousands of years!", "月球上的脚印能保留很长时间。它们可能在那里存在数千年！"], ["There are thousands of pieces of space junk floating around Earth.", "有成千上万片太空垃圾在地球周围漂浮。"], ["Space junk is man-made objects left in space. And the number is growing!", "太空垃圾是留在太空的人造物体。而且数量还在增长！"], ["What other facts do you know?", "你还知道其他事实吗？"]]}]}, {"name": "Energy, nature and us", "cn": "绿色能源", "words": [["power", "能；能量", "/ˈpaʊə(r)/"], ["electricity", "电", "/ɪˌlekˈtrɪsəti/"], ["solar", "太阳的", "/ˈsəʊlə(r)/"], ["type", "类型；种类", "/taɪp/"], ["energy", "能源", "/ˈenədʒi/"], ["source", "来源", "/sɔːs/"], ["light", "照亮", "/laɪt/"], ["heat", "加热；（使）变暖；热量", "/hiːt/"], ["cool", "（使）变凉，冷却", "/kuːl/"], ["run", "使运行", "/rʌn/"], ["resource", "资源", "/rɪˈsɔːs/"], ["few", "不多；很少（比较级 fewer）", "/fjuː/"], ["change", "（使）不同；改变", "/tʃeɪndʒ/"], ["quick", "迅速的；快的", "/kwɪk/"], ["shower", "淋浴", "/ˈʃaʊə(r)/"], ["unplug", "拔掉……的电源插头", "/ˌʌnˈplʌɡ/"], ["difference", "差别；不同（之处）", "/ˈdɪfrəns/"], ["reduce", "减少", "/rɪˈdjuːs/"], ["reuse", "再次使用；重复使用", "/ˌriːˈjuːz/"], ["drive", "驾驶；开车", "/draɪv/"], ["own", "自己的", "/əʊn/"], ["market", "集市；市场", "/ˈmɑːkɪt/"], ["bottle", "瓶子", "/ˈbɒtl/"], ["top", "（位置、级别或程度）最高的", "/tɒp/"], ["useful", "有用的；有益的", "/ˈjuːsfl/"], ["dirty", "脏的", "/ˈdɜːti/"], ["side", "一面；一边", "/saɪd/"], ["air conditioner", "空调机", "/ˈeə kənˈdɪʃənə(r)/"]], "phrases": [["run out", "用完"], ["make electricity", "发电"], ["come from", "来自"], ["find out", "发现"], ["work on it together", "共同做这件事"], ["wind power / solar power / water power", "风能 / 太阳能 / 水能"], ["green energy", "绿色能源"], ["light, heat and cool our homes", "给家里照明、供暖和降温"], ["cool a room", "给房间降温"], ["heat a house", "给房子供暖"], ["light a bulb", "点亮灯泡"], ["run a car", "驱动汽车"], ["dry up", "干涸"], ["save energy", "节约能源"], ["give an example", "举个例子"], ["take quick showers", "快速淋浴"], ["use LED lighting", "使用LED照明"], ["unplug the computers and TVs", "拔掉电脑和电视的电源"], ["make a big difference", "带来巨大的不同"], ["turn off", "关掉"], ["walk more and drive less", "多走路，少开车"], ["use air conditioners less", "少用空调"], ["bring our own bags", "自带袋子"], ["recycle bottles and boxes", "回收瓶子和盒子"], ["reduce energy use", "减少能源消耗"], ["at a time", "一次"], ["useful tips", "有用的提示"], ["both sides of paper", "纸的双面"], ["set the air conditioner to 26℃", "将空调设置为26℃"]], "patterns": [["What do you know about it?", "关于它你知道些什么？"], ["Running water can make electricity.", "流水可以发电。"], ["Where does water come from?", "水从哪儿来？"], ["Water comes from rivers, lakes and seas.", "水来自河流、湖泊和海洋。"], ["Wind power, solar power and water power are types of green energy.", "风能、太阳能和水能是不同类型的绿色能源。"], ["Many resources are running out. What should we do?", "很多资源快要耗尽了。我们该怎么办？"], ["How can we save energy?", "我们怎样才能节约能源？"], ["We can take quick showers.", "我们可以快速淋浴。"], ["We should always unplug our computers and TVs. Small changes can make a big difference.", "我们应该总是拔掉电脑和电视的电源插头。小小的改变能带来巨大的不同。"]], "trans": [["Hi, Mike. Any ideas about our project?", "嗨，迈克。对我们的项目有什么想法吗？"], ["Maybe we can talk about water power.", "也许我们可以谈水能。"], ["OK. We use water every day. Let's find out more about water power.", "好的。我们每天用水。让我们多了解水能。"], ["What do you know about it?", "关于它你知道什么？"], ["Running water can make electricity. We can get power from the sea too.", "流水可以发电。我们也可以从海洋获取能源。"], ["What else do you want to know about water?", "关于水你还想了解什么？"], ["Well, where does water come from? How do we make power from water?", "嗯，水从哪里来？我们怎样用水发电？"], ["Good questions. Let's go to the library. We can work on it together.", "好问题。我们去图书馆吧。我们可以一起做。"], ["Water comes from rivers, lakes and seas.", "水来自河流、湖泊和海洋。"], ["We use energy every day. But many resources are running out. What should we do?", "我们每天用能源。但很多资源快耗尽了。我们该怎么办？"], ["We should save energy. Then we will use fewer resources.", "我们应该节约能源。这样我们就会用更少的资源。"], ["How can we save energy?", "我们怎样才能节约能源？"], ["We should change our energy use.", "我们应该改变我们的能源使用方式。"], ["Can you give us an example, Binbin?", "你能给我们举个例子吗，斌斌？"], ["Sure. We can take quick showers. That will save energy and water.", "当然。我们可以快速淋浴。那会节约能源和水。"], ["I agree. We can also use LED lighting.", "我同意。我们还可以用LED照明。"], ["And we should always unplug our computers and TVs.", "而且我们应该总是拔掉电脑和电视的电源插头。"], ["Great! Small changes can make a big difference.", "太好了！小小的改变能带来巨大的不同。"], ["School is over. We should turn off the lights.", "放学了。我们应该关灯。"], ["Wind power, solar power and water power are types of green energy.", "风能、太阳能和水能是绿色能源的类型。"], ["They are clean and good for Mother Earth.", "它们很清洁，对地球母亲有益。"], ["We use green energy to light, heat and cool our homes and schools.", "我们用绿色能源给家和学校照明、供暖和降温。"], ["We also use it to run cars, buses and trains.", "我们还用它驱动汽车、公交车和火车。"], ["Electricity is useful. We use electricity to cool a room, heat a house, light a bulb and run a car.", "电很有用。我们用电脑给房间降温、给房子供暖、点亮灯泡、驱动汽车。"], ["What can make electricity? — Wind, water and the sun can make electricity.", "什么能发电？——风、水和太阳可以发电。"], ["Follow the \"3R\" rules to save energy and resources—every little thing helps!", "遵循“3R”原则来节约能源和资源——每件小事都有帮助！"], ["Reduce: Use air conditioners less. Walk more and drive less. Take quick showers.", "减少：少用空调。多走路少开车。快速淋浴。"], ["Reuse: Bring our own bags to shops and markets.", "再利用：去商店和集市自带袋子。"], ["Recycle: Recycle bottles and boxes. Recycle old clothes, toys and books.", "回收：回收瓶子和盒子。回收旧衣服、玩具和书。"], ["We should reduce energy use. We can take quick showers, and use air conditioners less. And we can reuse bags, or recycle old toys, bottles.", "我们应该减少能源消耗。我们可以快速淋浴，少用空调。我们可以再利用袋子，或回收旧玩具、瓶子。"], ["This will save more energy and resources.", "这会节约更多能源和资源。"], ["Mother Earth is running out of resources! What should we do?", "地球母亲的资源快耗尽了！我们该怎么办？"], ["Here are our top three ideas. We should all try to save energy and save our Earth!", "这是我们的三个最佳建议。我们都应该努力节约能源，拯救地球！"], ["Take a quick shower.", "快速淋浴。"], ["Wash all your dirty clothes together, not one at a time.", "把脏衣服凑在一起洗，不要一件一件洗。"], ["Wash fruit and vegetables, then use the water again.", "洗水果蔬菜的水，之后再利用。"], ["Turn off your TV or computer and unplug it.", "关掉电视或电脑，并拔掉电源插头。"], ["Set your air conditioner to 26℃ or more in summer.", "夏天把空调调到26℃或更高。"], ["Use both sides of paper.", "纸要用双面。"], ["Use old bottles again. You can put noodles or pencils in them.", "再次使用旧瓶子。你可以在里面放面条或铅笔。"], ["How can we all help Mother Earth?", "我们怎样一起帮助地球母亲？"], ["We are running a competition to find some helpful ideas from our readers.", "我们正在举办一个比赛，征集读者的好主意。"], ["Please write to us and let us know your ideas and tips. Thank you.", "请写信告诉我们你的想法和小贴士。谢谢。"], ["We are running out of resources. But it is not too late. We can do things to change this.", "我们的资源快耗尽了。但现在还不算太晚。我们可以做些什么来改变。"], ["What does green energy mean to you?", "绿色能源对你意味着什么？"], ["We use green energy to light our homes. We also use it to run cars.", "我们用绿色能源给家照明。我们还用它驱动汽车。"], ["Many resources will run out. How can we save energy? We follow the \"3R\" rules. We should reduce, reuse and recycle.", "很多资源会耗尽。我们怎样才能节约能源？我们遵循“3R”原则。我们应该减少、再利用和回收。"], ["At home, what things use energy? Where does their energy come from?", "在家里，什么东西用能源？它们的能源从哪里来？"], ["What green energy do you know? How do we save energy?", "你知道哪些绿色能源？我们怎样节约能源？"], ["It was a sunny day. Grandpa, Binbin and Robin played outside.", "那是一个晴朗的日子。爷爷、斌斌和罗宾在外面玩。"], ["They didn't want to go back to the kitchen to cook lunch. So, what could they do?", "他们不想回厨房做午饭。那么，他们能做什么呢？"], ["Grandpa had an idea. \"The sun is very hot. We can use solar power to cook our lunch here,\" he said.", "爷爷有个主意。“太阳很热。我们可以用太阳能在这里做午饭，”他说。"], ["\"Let's make a solar oven!\" So, they did.", "“让我们做一个太阳能烤箱吧！”于是，他们做了。"], ["\"Wow! How does the box keep the heat? Why do we use black paper?\" Binbin wanted to know.", "“哇！盒子怎样保温？为什么用黑纸？”斌斌想知道。"], ["Soon their meal was ready.", "很快他们的饭做好了。"], ["\"The food is delicious! And we cooked with no gas or electricity! That's super cool!\" said Binbin.", "“食物真好吃！而且我们没用燃气或电就做好了饭！太酷了！”斌斌说。"], ["\"Sunlight is a great source of energy. It can help light our house. It can run cars! And we can use it to cook too!\" said Robin.", "“阳光是很好的能源来源。它能给我们房子照明。它能驱动汽车！我们还可以用它做饭！”罗宾说。"], ["\"Yes, we should use energy in smart ways,\" said Grandpa with a smile.", "“是的，我们应该聪明地使用能源，”爷爷笑着说。"]], "verbs": [["be (am, is, are)", "was, were"], ["put", "put"], ["say", "said"], ["do", "did"], ["have (has)", "had"], ["let", "let"], ["", ""]], "grammar": [["节能建议", "should + 动词原形：应该做某事。", "We should ___ energy.", "save", ["saved", "saving"], "should 后面用原形 save。"], ["询问来源", "Where does + 单数主语 + 动词原形？", "Where does water ___ from?", "come", ["comes", "coming"], "does 后面用原形 come。"], ["3R 原则", "Reduce 减少使用；Reuse 再利用；Recycle 回收。", "Use the same shopping bag again: ___.", "Reuse", ["Reduce", "Recycle"], "同一个袋子再次使用，属于 Reuse。"]], "passages": [{"title": "水能探究计划", "items": [["Hi, Mike. Any ideas about our project?", "嗨，迈克。对我们的项目有什么想法吗？"], ["Maybe we can talk about water power.", "也许我们可以谈水能。"], ["OK. We use water every day. Let's find out more about water power.", "好的。我们每天用水。让我们多了解水能。"], ["What do you know about it?", "关于它你知道什么？"], ["Running water can make electricity. We can get power from the sea too.", "流水可以发电。我们也可以从海洋获取能源。"], ["What else do you want to know about water?", "关于水你还想了解什么？"], ["Well, where does water come from? How do we make power from water?", "嗯，水从哪里来？我们怎样用水发电？"], ["Good questions. Let's go to the library. We can work on it together.", "好问题。我们去图书馆吧。我们可以一起做。"], ["Water comes from rivers, lakes and seas.", "水来自河流、湖泊和海洋。"]]}, {"title": "讨论节约能源的方法", "items": [["We use energy every day. But many resources are running out. What should we do?", "我们每天用能源。但很多资源快耗尽了。我们该怎么办？"], ["We should save energy. Then we will use fewer resources.", "我们应该节约能源。这样我们就会用更少的资源。"], ["How can we save energy?", "我们怎样才能节约能源？"], ["We should change our energy use.", "我们应该改变我们的能源使用方式。"], ["Can you give us an example, Binbin?", "你能给我们举个例子吗，斌斌？"], ["Sure. We can take quick showers. That will save energy and water.", "当然。我们可以快速淋浴。那会节约能源和水。"], ["I agree. We can also use LED lighting.", "我同意。我们还可以用LED照明。"], ["And we should always unplug our computers and TVs.", "而且我们应该总是拔掉电脑和电视的电源插头。"], ["Great! Small changes can make a big difference.", "太好了！小小的改变能带来巨大的不同。"], ["School is over. We should turn off the lights.", "放学了。我们应该关灯。"]]}, {"title": "Let's learn · 绿色能源与3R（p.65 / p.67）", "items": [["Wind power, solar power and water power are types of green energy.", "风能、太阳能和水能是绿色能源的类型。"], ["They are clean and good for Mother Earth.", "它们很清洁，对地球母亲有益。"], ["We use green energy to light, heat and cool our homes and schools.", "我们用绿色能源给家和学校照明、供暖和降温。"], ["We also use it to run cars, buses and trains.", "我们还用它驱动汽车、公交车和火车。"], ["Electricity is useful. We use electricity to cool a room, heat a house, light a bulb and run a car.", "电很有用。我们用电脑给房间降温、给房子供暖、点亮灯泡、驱动汽车。"], ["What can make electricity? — Wind, water and the sun can make electricity.", "什么能发电？——风、水和太阳可以发电。"], ["Follow the \"3R\" rules to save energy and resources—every little thing helps!", "遵循“3R”原则来节约能源和资源——每件小事都有帮助！"], ["Reduce: Use air conditioners less. Walk more and drive less. Take quick showers.", "减少：少用空调。多走路少开车。快速淋浴。"], ["Reuse: Bring our own bags to shops and markets.", "再利用：去商店和集市自带袋子。"], ["Recycle: Recycle bottles and boxes. Recycle old clothes, toys and books.", "回收：回收瓶子和盒子。回收旧衣服、玩具和书。"], ["We should reduce energy use. We can take quick showers, and use air conditioners less. And we can reuse bags, or recycle old toys, bottles.", "我们应该减少能源消耗。我们可以快速淋浴，少用空调。我们可以再利用袋子，或回收旧玩具、瓶子。"], ["This will save more energy and resources.", "这会节约更多能源和资源。"]]}, {"title": "Read and write · 节约能源，拯救地球（p.68）", "items": [["Mother Earth is running out of resources! What should we do?", "地球母亲的资源快耗尽了！我们该怎么办？"], ["Here are our top three ideas. We should all try to save energy and save our Earth!", "这是我们的三个最佳建议。我们都应该努力节约能源，拯救地球！"], ["Take a quick shower.", "快速淋浴。"], ["Wash all your dirty clothes together, not one at a time.", "把脏衣服凑在一起洗，不要一件一件洗。"], ["Wash fruit and vegetables, then use the water again.", "洗水果蔬菜的水，之后再利用。"], ["Turn off your TV or computer and unplug it.", "关掉电视或电脑，并拔掉电源插头。"], ["Set your air conditioner to 26℃ or more in summer.", "夏天把空调调到26℃或更高。"], ["Use both sides of paper.", "纸要用双面。"], ["Use old bottles again. You can put noodles or pencils in them.", "再次使用旧瓶子。你可以在里面放面条或铅笔。"], ["How can we all help Mother Earth?", "我们怎样一起帮助地球母亲？"], ["We are running a competition to find some helpful ideas from our readers.", "我们正在举办一个比赛，征集读者的好主意。"], ["Please write to us and let us know your ideas and tips. Thank you.", "请写信告诉我们你的想法和小贴士。谢谢。"], ["We are running out of resources. But it is not too late. We can do things to change this.", "我们的资源快耗尽了。但现在还不算太晚。我们可以做些什么来改变。"]]}, {"title": "Project · 绿色能源展示（p.70-71）", "items": [["What does green energy mean to you?", "绿色能源对你意味着什么？"], ["We use green energy to light our homes. We also use it to run cars.", "我们用绿色能源给家照明。我们还用它驱动汽车。"], ["Many resources will run out. How can we save energy? We follow the \"3R\" rules. We should reduce, reuse and recycle.", "很多资源会耗尽。我们怎样才能节约能源？我们遵循“3R”原则。我们应该减少、再利用和回收。"], ["At home, what things use energy? Where does their energy come from?", "在家里，什么东西用能源？它们的能源从哪里来？"], ["What green energy do you know? How do we save energy?", "你知道哪些绿色能源？我们怎样节约能源？"]]}, {"title": "Reading time · 自制太阳能烤箱（p.72-73）", "items": [["It was a sunny day. Grandpa, Binbin and Robin played outside.", "那是一个晴朗的日子。爷爷、斌斌和罗宾在外面玩。"], ["They didn't want to go back to the kitchen to cook lunch. So, what could they do?", "他们不想回厨房做午饭。那么，他们能做什么呢？"], ["Grandpa had an idea. \"The sun is very hot. We can use solar power to cook our lunch here,\" he said.", "爷爷有个主意。“太阳很热。我们可以用太阳能在这里做午饭，”他说。"], ["\"Let's make a solar oven!\" So, they did.", "“让我们做一个太阳能烤箱吧！”于是，他们做了。"], ["\"Wow! How does the box keep the heat? Why do we use black paper?\" Binbin wanted to know.", "“哇！盒子怎样保温？为什么用黑纸？”斌斌想知道。"], ["Soon their meal was ready.", "很快他们的饭做好了。"], ["\"The food is delicious! And we cooked with no gas or electricity! That's super cool!\" said Binbin.", "“食物真好吃！而且我们没用燃气或电就做好了饭！太酷了！”斌斌说。"], ["\"Sunlight is a great source of energy. It can help light our house. It can run cars! And we can use it to cook too!\" said Robin.", "“阳光是很好的能源来源。它能给我们房子照明。它能驱动汽车！我们还可以用它做饭！”罗宾说。"], ["\"Yes, we should use energy in smart ways,\" said Grandpa with a smile.", "“是的，我们应该聪明地使用能源，”爷爷笑着说。"]]}]}, {"name": "Revision", "cn": "综合复习", "words": [], "phrases": [], "patterns": [], "trans": [["What do you want to learn about, children?", "孩子们，你们想学什么？"], ["I want to know about space and planets.", "我想了解太空和行星。"], ["My sister was ill for some time. It made me sad. I want to learn more about illness.", "我姐姐病了一段时间。这让我很难过。我想多了解疾病。"], ["I want to know more about the Chinese festivals.", "我想多了解中国的节日。"], ["Those are great ideas! What can help you learn about these things?", "这些主意很棒！什么能帮助你们学习这些内容？"], ["We can read books or use the internet. We can travel to different places.", "我们可以读书或上网。我们可以去不同的地方旅行。"], ["That's right. We can also learn in museums. This week, we're going to plan some museum trips.", "说得对。我们还可以在博物馆学习。这周我们要计划一些博物馆之旅。"], ["Which museums do you want to visit? How much money do you need? Think about these questions and make a plan.", "你们想参观哪些博物馆？需要多少钱？思考这些问题并制定计划。"], ["Do you have a plan for your museum trip?", "你有博物馆之行的计划吗？"], ["Yes, I'm going to visit some museums online. I can watch videos and even buy nice gifts online.", "是的，我打算在线参观一些博物馆。我可以看视频，甚至在网上买好看的礼物。"], ["Where are you going, Zhang Peng?", "你要去哪里，张鹏？"], ["I'm going to visit the Great Wall Museum.", "我打算参观长城博物馆。"], ["Wow! But it's very far. How much are you going to take?", "哇！但它很远。你打算带多少钱？"], ["I have 100 yuan. The museum is free. But I need to take a bus and I'm going to buy some food and drink. Before that, I need a haircut. I want to look good in my photos.", "我有100元。博物馆免费。但我需要坐公交车，还要买食物和饮料。在那之前，我需要理个发。我想在照片里好看。"], ["Reporter: What did you see in the museum? — Binbin: I saw a big spaceship. I also went into a mini space station.", "记者：你在博物馆看到了什么？——斌斌：我看到一艘大宇宙飞船。我还进了迷你空间站。"], ["Did you see other interesting things there?", "你在那里看到其他有趣的东西了吗？"], ["Yes. A robot dressed in a Tang suit. She pasted fu on the door.", "是的。一个穿唐装的机器人。她往门上贴“福”字。"], ["What did you like about the museum?", "你喜欢博物馆的什么？"], ["We watched a short play about Chang'e and Houyi. Then we saw an amazing robot. He gave us a speech.", "我们看了一个关于嫦娥和后羿的短剧。然后我们看到了一个惊人的机器人。他给我们做了演讲。"], ["It was the Mid-Autumn Festival. On the Moon, the Rabbit ran and jumped. Then he saw a big spaceship in the sky!", "中秋节到了。在月球上，玉兔又跑又跳。然后它看到天空中有一艘大宇宙飞船！"], ["Hello, Rabbit! / Hi, Houyi! Welcome!", "你好，玉兔！/ 嗨，后羿！欢迎！"], ["Thank you. How is Chang'e?", "谢谢。嫦娥好吗？"], ["Chang'e is always sad, but she will be happy now. Look, here she comes. It's so good to have family around again!", "嫦娥总是很伤心，但她现在会开心了。看，她来了。家人又团聚了真好！"], ["How did you get to the Moon?", "你是怎么到月球上的？"], ["A spaceship brought me here. We have great spaceships in China.", "一艘宇宙飞船带我来的。中国有很棒的宇宙飞船。"], ["Chang'e, you came here so long ago. What did you do on the Moon?", "嫦娥，你很久以前就来到这里。你在月球上做什么？"], ["Rabbit and I read books and sang folk songs. But I always thought of our days together. What did you do on Earth?", "我和玉兔读书、唱民歌。但我总是想起我们在一起的日子。你在地球上做什么？"], ["We live on Earth. We are far from our neighbours, like the Moon and the Mars. But with science and technology, we can find out more about them.", "我们生活在地球上。我们离邻居很远，比如月球和火星。但借助科学技术，我们能了解更多。"], ["Smartphones and the internet bring us closer to each other. We can share our feelings with friends far away. Even in space, astronauts can call their families.", "智能手机和互联网让我们彼此更近。我们可以和远方的朋友分享感受。即使在太空，宇航员也能给家人打电话。"], ["Green energy like solar, wind or water power is also part of our life. We use technologies to reduce energy use, recycle our waste and save resources.", "像太阳能、风能或水能这样的绿色能源也是我们生活的一部分。我们用技术减少能源消耗、回收垃圾和节约资源。"], ["Science and technology make our lives better.", "科学技术让我们的生活更好。"], ["Did you enjoy listening to the bird song? Did you feel the cool wind from the sea? Is your stress gone?", "你喜欢听鸟鸣吗？你感受到来自大海的凉风了吗？你的压力消失了吗？"], ["Stress is sometimes bad for us. Science can help, but we also need to help ourselves.", "压力有时对我们有害。科学能帮忙，但我们也需要帮助自己。"], ["We should take care of our body. We need to have a healthy diet and exercise too. Remember, get enough sleep and don't stay up late.", "我们应该照顾好自己的身体。我们需要健康的饮食，还要锻炼。记住，保证充足睡眠，不要熬夜。"], ["We must also take care of our mind. Think about happy things.", "我们也必须照顾好自己的心灵。想开心的事情。"], ["You can keep a diary, join some clubs, listen to music or read books.", "你可以写日记、加入社团、听音乐或读书。"], ["Spend time with your friends and
