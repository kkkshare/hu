function changeCat(c){stopRace();category=c;page=0;if(c==='writing'){if(current===0)wrShow();else wuShow();return}if(c==='videos'){games={};showVideos();return}if(c==='race'){games={};raceMenu();return}renderUnit()}
function renderUnit(){games={};const u=DATA[current];let items=u[category];let size=category==='grammar'?Math.min(items.length,4):category==='patterns'?2:5;let groups=[];for(let i=0;i<items.length;i+=size)groups.push(items.slice(i,i+size));if(category==='trans')groups=u.passages.map(p=>p.items);let perPage=category==='trans'?1:4;let pageCount=Math.ceil(groups.length/perPage);page=Math.min(page,Math.max(0,pageCount-1));$('#app').innerHTML=`<button onclick="home()">← 单元地图</button><div class="unit-title"><div><div class="eyebrow">${current<6?'UNIT 0'+(current+1):'REVISION'} · ${u.cn}</div><h1>${u.name}</h1><span class="small">阅读 → 挑战 → 反馈 → 再挑战</span></div><span style="font-size:46px">${icons[current]}</span></div><nav class="tabs">${UNIT_VIDEOS[current]?`<button onclick="changeCat('videos')">▶ 课文动画</button>`:''}${current<6?`<button onclick="changeCat('race')">🏆 词汇配对赛</button>`:''}${Object.keys(labels).filter(k=>u[k].length).map(k=>`<button class="${k===category?'active':''}" onclick="changeCat('${k}')">${labels[k]}</button>${current<6&&k==='trans'?`<button onclick="changeCat('writing')">✎ Read and Write 写作坊</button>`:''}`).join('')}</nav><div class="gamebar"><p class="small">${labels[category]} · 共 ${items.length} ${category==='grammar'?'个知识点':'条'} · 每个小组学完即练</p>${pageCount>1?`<select aria-label="选择知识组" onchange="page=Number(this.value);renderUnit()">${Array.from({length:pageCount},(_,i)=>`<option value="${i}" ${i===page?'selected':''}>${category==='trans'?esc(u.passages[i].title):`第 ${i*4+1}–${Math.min(i*4+4,groups.length)} 组`}</option>`).join('')}</select>`:''}</div><div id="lessons"></div><div class="footer">词汇和中英对照沿用已有学习网页；游戏题为配套练习。朗读效果取决于设备语音支持。</div>`;

function wuPracticeCount(){const d=wuDraft();$('#wuParagraphCount').textContent='这一部分约 '+wuWords(d.paragraphs[wuParagraph])+' 词；先写清楚，再补细节。';$('#wuPracticePreview').textContent=d.paragraphs.filter(x=>x.trim()).join('\n\n')||'还没有练写内容。'}
function wuSetSupport(s){if(!['frames','keywords','none'].includes(s))return;wuDraft().support=s;wuSave();wuStop();wuPractice()}
function wuPickParagraph(i){wuStop();wuParagraph=i;wuPractice();$('#wuBody').scrollIntoView({block:'start'})}
function wuNextParagraph(){if(!wuDraft().paragraphs[wuParagraph].trim()){$('#wuPracticeStatus').textContent='先写一两句自己的英文，再继续。需要帮助时可以打开句子开头。';return}if(wuParagraph<2){wuPickParagraph(wuParagraph+1);return}wuShow(4)}
function wuWords(text){return (text.match(/[A-Za-z]+(?:['’][A-Za-z]+)*/g)||[]).length}
function wuSentences(text){return (text.match(/[^.!?。！？]+[.!?。！？]+|[^.!?。！？]+$/g)||[]).filter(s=>/[A-Za-z]/.test(s)).length}
function wuIndependent(){const t=wuTopic(),d=wuDraft();$('#wuBody').innerHTML=`<h2>05 · 关掉提示，自己完成</h2><p>想想读者需要知道什么，用自己的提纲独立组织短文。这里不显示范例和句子开头；你可以换一种表达或调整顺序。</p><details class="wu-own-outline"><summary>需要时，只查看我自己的提纲</summary>${wuOutline()}<p><button onclick="wuShow(2)">修改我的提纲</button></p></details><label for="wuTitle">我的标题<input id="wuTitle" value="${esc(d.title)}" maxlength="120"></label><label class="wr-editor-label" for="wuDraft">我的独立作文<textarea id="wuDraft" spellcheck="true" rows="9" placeholder="想清楚开头、展开和结尾，再用自己的话完成短文……">${esc(d.independent)}</textarea></label><p id="wuCount" class="small"></p><p><button onclick="wuReadMyDraft()">♪ 听一遍我写的作文</button> <button onclick="wuShow(3)">回到分段练写</button></p><p class="small">听一遍后，找一句需要改进的话：信息说清了吗？能否补一个细节、例子或理由？请直接在上面修改。</p><details class="wu-transfer"><summary>我写好了，试试另一个情境</summary><p>${esc(t.transfer)}</p><p class="small">可以先复制保存这篇，再用相同的方法在纸上完成新任务。</p></details><div class="wu-review"><h3>读一遍，再逐项自查</h3><p>检查完成后再打勾。内容或标题修改后，需要重新自查。</p><div class="wr-checks">${t.checks.map((c,i)=>`<label><input type="checkbox" data-wucheck="${i}" ${d.checks[i]?'checked':''}> ${esc(c)}</label>`).join('')}</div><label for="wuName">作品署名（选填）<input id="wuName" value="${esc(d.name)}" maxlength="40" placeholder="名字、昵称或虚构署名"></label><p><button class="primary" onclick="wuFinish()">完成自查，展示我的作品 ★</button></p><p id="wuFinishStatus" role="status" aria-live="polite"></p><p class="small">徽章记录独立写作与自查过程。词数只是参考，语言和内容还可以请老师或同学一起看。</p></div><article id="wrCard" class="wr-card wu-card" ${d.finished?'':'hidden'}><div class="eyebrow">MY WRITING · UNIT 0${current+1}</div><h2 id="wuCardTitle">${esc(d.title||t.title)}</h2><div id="wuCardText" class="wr-prose">${esc(d.independent)}</div><p id="wuCardAuthor">${esc(d.name?'By '+d.name:'My own words')}</p><div>★ 独立成文　★ 认真自查</div></article><p><button onclick="wuCopy()">复制作文</button> <button onclick="wuPrint()">打印作品卡</button></p><p id="wuCopyStatus" role="status"></p>`;
$('#wuTitle').oninput=e=>{d.title=e.target.value;wuInvalidate();wuResetChecks();wuSave();wuUpdateCard()};$('#wuDraft').oninput=e=>{d.independent=e.target.value;wuInvalidate();wuResetChecks();wuSave();wuCount();wuUpdateCard()};$('#wuName').oninput=e=>{d.name=e.target.value;wuSave();wuUpdateCard()};document.querySelectorAll('[data-wucheck]').forEach(e=>e.onchange=()=>{d.checks[Number(e.dataset.wucheck)]=e.checked;d.finished=false;$('#wrCard').hidden=true;$('#wuFinishStatus').textContent='';wuSave()});wuCount()}
function wuResetChecks(){document.querySelectorAll('[data-wucheck]').forEach(e=>e.checked=false);$('#wrCard').hidden=true;$('#wuFinishStatus').textContent=''}
function wuCount(){const d=wuDraft(),text=d.independent;$('#wuCount').textContent=`约 ${wuWords(text)} 个英文词 · 约 ${wuSentences(text)} 句（仅供参考）。先把内容写清楚，再逐步补充细节。`}
function wuUpdateCard(){const d=wuDraft();$('#wuCardTitle').textContent=d.title||wuTopic().title;$('#wuCardText').textContent=d.independent;$('#wuCardAuthor').textContent=d.name?'By '+d.name:'My own words'}
function wuReadMyDraft(){if(!wuDraft().independent.trim()){$('#wuFinishStatus').textContent='先写下自己的作文，再听一听。';return}speak(wuDraft().independent)}
function wuFinish(){const d=wuDraft(),t=wuTopic(),el=$('#wuFinishStatus');if(wuWords(d.independent)<10){el.textContent='先写出自己的完整短文，再来展示。目标是至少5句话，也可以回到分段练写继续练习。';return}if(!t.checks.every((_,i)=>d.checks[i])){el.textContent='请先完成以上'+t.checks.length+'项自查，再展示作品。';return}const fresh=!d.finished;d.finished=true;wuSave();wuUpdateCard();$('#wrCard').hidden=false;el.textContent='你已经独立成文并完成自查！请同学读一读：哪一句最清楚？哪里还可以补充？';if(fresh)celebrateCorrect(el)}
function wuPlainText(){const d=wuDraft();return (d.title||wuTopic().title)+'\n\n'+d.independent+(d.name?'\n\nBy '+d.name:'')}
async function wuCopy(){if(!wuDraft().independent.trim()){$('#wuCopyStatus').textContent='先写下自己的作文，再复制。';return}try{await navigator.clipboard.writeText(wuPlainText());$('#wuCopyStatus').textContent='已复制，可以粘贴到作业或分享给老师。'}catch(e){$('#wuCopyStatus').textContent='自动复制不可用，请选中自己的作文文字复制。'}}
function wuPrint(){if(!wuDraft().finished){$('#wuCopyStatus').textContent='请先完成自查并展示作品，再打印作品卡。';return}window.print()}
function wuStart(){clearTimeout(wuTimer);wuQuiz={unit:current,topic:wuTopic().id,step:wuStep,index:0,locked:false};wuRenderQuiz()}
function wuQuizActive(q){return q&&wuQuiz===q&&category==='writing'&&current===q.unit&&wuTopic().id===q.topic&&wuStep===q.step}
function wuRenderQuiz(){const q=wuQuiz;if(!wuQuizActive(q))return;const items=wuTopic().quizzes[q.step];if(q.index>=items.length){$('#wuGame').innerHTML='<h3>★ 方法小挑战完成！</h3><p>把刚学到的写法用在自己的内容里。</p><button onclick="wuStart()">再玩一次</button>';return}q.locked=false;const x=items[q.index];$('#wuGame').innerHTML=`<h3>PLAY · ${q.index+1} / ${items.length}</h3><p class="prompt">${esc(x[0])}</p><div class="options">${x[1].map((s,i)=>`<button onclick="wuAnswer(${i},this)">${esc(s)}</button>`).join('')}</div><p id="wuFeedback" role="status" aria-live="polite"></p>`}
function wuAnswer(i,b){const q=wuQuiz;if(!wuQuizActive(q)||q.locked)return;const x=wuTopic().quizzes[q.step][q.index],feedback=$('#wuFeedback');if(i!==x[2]){feedback.textContent='再想一想：'+x[3];b.disabled=true;return}q.locked=true;feedback.textContent='✓ '+x[3]+' 即将自动继续…';celebrateCorrect(b);$('#wuGame').querySelectorAll('button').forEach(el=>el.disabled=true);wuTimer=setTimeout(()=>{if(wuQuizActive(q)){q.index++;wuRenderQuiz()}},1000)}
const wuBaseText=window.render_game_to_text;window.render_game_to_text=()=>{const base=JSON.parse(wuBaseText());if(category==='writing'&&current>0&&wuUnit()){const d=wuDraft();base.writing={unit:current+1,topic:wuTopic().id,step:wuStep,paragraph:wuParagraph,support:d.support,question:wuQuiz?.index,locked:wuQuiz?.locked,outline:d.fields,paragraphs:d.paragraphs,draft:d.independent,checks:d.checks,finished:d.finished}}return JSON.stringify(base)};

home();
</script></html>
